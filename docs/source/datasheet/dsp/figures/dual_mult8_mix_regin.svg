<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="submoduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="multGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>

    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-rst" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="450" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    dual_mult8_mix_regin Architecture
  </text>
  <text x="450" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Dual 8-Bit Multiplier Subsystem (Combinational vs Input-Registered Channels)
  </text>

  <!-- Main Module Container -->
  <rect x="120" y="80" width="670" height="380" rx="10" fill="url(#moduleGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#1d4ed8">
    dual_mult8_mix_regin (Top)
  </text>

  <text x="770" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#64748b" text-anchor="end">
    parameter DATA_WIDTH = 8
  </text>

  <!-- ================= CHANNEL 0: COMBINATIONAL MULTIPLIER ================= -->
  <rect x="220" y="130" width="480" height="120" rx="6" fill="url(#submoduleGrad)" stroke="#94a3b8" stroke-width="1.5" />
  <text x="235" y="152" font-family="monospace, &#39;Courier New&#39;" font-size="12" font-weight="bold" fill="#334155">
    mult8_dsp (mult_8)
  </text>

  <!-- Combinational Multiplier Core 0 -->
  <rect x="380" y="155" width="220" height="70" rx="6" fill="url(#multGrad)" stroke="#0284c7" stroke-width="1.5" />
  <text x="490" y="185" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
    A * B
  </text>
  <text x="490" y="205" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    Combinational Multiplier
  </text>

  <!-- Channel 0 Inputs -->
  <path d="M 40 170 L 380 170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-bus)" />
  <text x="50" y="162" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">a0[0:7]</text>

  <path d="M 40 210 L 380 210" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-bus)" />
  <text x="50" y="202" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">b0[0:7]</text>

  <!-- Channel 0 Output -->
  <path d="M 600 190 L 840 190" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <text x="830" y="182" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">out0[0:15]</text>


  <!-- ================= CHANNEL 1: INPUT-REGISTERED MULTIPLIER ================= -->
  <rect x="220" y="280" width="480" height="160" rx="6" fill="url(#submoduleGrad)" stroke="#7c3aed" stroke-width="1.5" />
  <text x="235" y="302" font-family="monospace, &#39;Courier New&#39;" font-size="12" font-weight="bold" fill="#6d28d9">
    mult8_regin_dsp (mult_8_regin)
  </text>

  <!-- Input Registers -->
  <rect x="330" y="320" width="90" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="375" y="344" font-family="monospace, &#39;Courier New&#39;" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">a_reg[0:7]</text>
  <path d="M 330 350 L 340 350 L 335 343 Z" fill="none" stroke="#ea580c" stroke-width="1" />

  <rect x="330" y="380" width="90" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="375" y="404" font-family="monospace, &#39;Courier New&#39;" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">b_reg[0:7]</text>
  <path d="M 330 410 L 340 410 L 335 403 Z" fill="none" stroke="#ea580c" stroke-width="1" />

  <!-- Registered Multiplier Core 1 -->
  <rect x="480" y="335" width="180" height="70" rx="6" fill="url(#multGrad)" stroke="#0284c7" stroke-width="1.5" />
  <text x="570" y="365" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
    a_reg * b_reg
  </text>
  <text x="570" y="385" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    1-Cycle Latency Product
  </text>

  <!-- Channel 1 Inputs -->
  <path d="M 40 340 L 330 340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-bus)" />
  <text x="50" y="332" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">a1[0:7]</text>

  <path d="M 40 400 L 330 400" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-bus)" />
  <text x="50" y="392" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">b1[0:7]</text>

  <!-- Inter-stage Connections (Reg to Mult) -->
  <path d="M 420 340 L 480 350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-bus)" />
  <path d="M 420 400 L 480 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-bus)" />

  <!-- Channel 1 Output -->
  <path d="M 660 370 L 840 370" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <text x="830" y="362" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">out1[0:15]</text>

  <!-- Global Control Inputs -->
  <path d="M 40 470 L 280 470 L 280 350 L 330 350" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-clk)" />
  <path d="M 280 410 L 330 410" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-clk)" />
  <text x="50" y="462" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#c2410c">clk</text>

  <path d="M 40 495 L 300 495 L 300 358 L 330 358" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-rst)" />
  <path d="M 300 418 L 330 418" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-rst)" />
  <text x="50" y="487" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#dc2626">rst</text>

  <!-- Legend -->
  <g transform="translate(180, 485)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2" />
    <text x="28" y="4" font-family="sans-serif" font-size="10" fill="#334155">Data Bus</text>

    <line x1="130" y1="0" x2="150" y2="0" stroke="#ea580c" stroke-width="1.5" />
    <text x="158" y="4" font-family="sans-serif" font-size="10" fill="#334155">Clock (clk)</text>

    <line x1="260" y1="0" x2="280" y2="0" stroke="#dc2626" stroke-width="1.5" />
    <text x="288" y="4" font-family="sans-serif" font-size="10" fill="#334155">Reset (rst)</text>

    <line x1="390" y1="0" x2="410" y2="0" stroke="#64748b" stroke-width="2" />
    <text x="418" y="4" font-family="sans-serif" font-size="10" fill="#334155">Internal Registered Bus</text>
  </g>
</svg>