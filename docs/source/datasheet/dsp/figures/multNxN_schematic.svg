<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#28a745"/>
    </marker>
    <style>
      .boundary { fill: #f8f9fa; stroke: #ced4da; stroke-width: 2; rx: 8; ry: 8; }
      .subbox { fill: #e8f4fd; stroke: #007bff; stroke-width: 1.5; rx: 4; ry: 4; }
      .title { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 10px; font-style: italic; fill: #6c757d; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 12px; fill: #333; }
      .wire-green { fill: none; stroke: #28a745; stroke-width: 1.5; marker-end: url(#arrow-green); }
      .wire-dark { fill: none; stroke: #333333; stroke-width: 1.5; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Outer System Boundary -->
  <rect x="40" y="30" width="720" height="390" class="boundary"/>
  <text x="400" y="55" class="title">multN (Parameterized Combinatorial Multiplier)</text>

  <!-- ==================== SUB-BLOCK ==================== -->
  
  <!-- Combinatorial Multiplier Sub-Block -->
  <rect x="280" y="110" width="260" height="140" class="subbox"/>
  <text x="410" y="150" class="title" font-size="12px">Combinatorial Multiplier</text>
  <text x="410" y="170" class="subtitle">Y = A * B</text>
  <text x="410" y="195" class="subtitle" font-size="9px">DATA_WIDTH = N</text>


  <!-- ==================== INPUT WIRES (LEFT) ==================== -->

  <!-- Input A -->
  <text x="65" y="145" class="label" font-weight="bold">A [DATA_WIDTH-1:0]</text>
  <path d="M 190,140 L 280,140" class="wire-green"/>

  <!-- Input B -->
  <text x="65" y="205" class="label" font-weight="bold">B [DATA_WIDTH-1:0]</text>
  <path d="M 190,200 L 280,200" class="wire-green"/>


  <!-- ==================== OUTPUT WIRE (RIGHT) ==================== -->

  <!-- Wide Output Wire Y -->
  <text x="575" y="185" class="label" font-weight="bold">Y [(2*DATA_WIDTH)-1:0]</text>
  <path d="M 540,180 L 635,180" class="wire-dark"/>

</svg>
