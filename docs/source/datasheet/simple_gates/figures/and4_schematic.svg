<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <!-- Grid pattern for background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>

    <!-- Shadow filter for main block -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" fill="#f8fafc" rx="8"/>
  <rect width="720" height="360" fill="url(#grid)" rx="8"/>

  <!-- Main Module Box -->
  <rect x="180" y="40" width="360" height="280" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#drop-shadow)"/>
  <rect x="180" y="40" width="360" height="36" rx="12" fill="#dbeafe"/>
  <rect x="180" y="64" width="360" height="12" fill="#dbeafe"/>

  <!-- Module Header Label -->
  <text x="360" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">and4</text>

  <!-- INPUT: a -->
  <path d="M 60 100 L 178 100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="92" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">a</text>
  <text x="188" y="104" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">a</text>

  <!-- INPUT: b -->
  <path d="M 60 140 L 178 140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="132" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">b</text>
  <text x="188" y="144" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">b</text>

  <!-- INPUT: c -->
  <path d="M 60 180 L 178 180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="172" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">c</text>
  <text x="188" y="184" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">c</text>

  <!-- INPUT: d -->
  <path d="M 60 220 L 178 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="212" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">d</text>
  <text x="188" y="224" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">d</text>

  <!-- OUTPUT: out -->
  <path d="M 540 160 L 658 160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="532" y="164" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">out</text>
  <text x="653" y="152" font-family="monospace" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="end">out</text>

  <!-- INTERNAL WIRING TO 4-INPUT AND GATE -->
  <path d="M 180 100 L 220 100 L 220 108 L 245 108" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 180 140 L 220 140 L 220 126 L 245 126" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 180 180 L 220 180 L 220 194 L 245 194" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 180 220 L 220 220 L 220 212 L 245 212" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- 4-Input AND Gate Shape -->
  <g transform="translate(245, 90)">
    <path d="M 0 0 L 25 0 C 50 0, 70 20, 70 60 C 70 100, 50 120, 25 120 L 0 120 Z" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
    <text x="32" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">&amp;</text>
  </g>

  <!-- Wire: AND Gate Output -> Module Output Port -->
  <path d="M 315 160 L 540 160" stroke="#475569" stroke-width="2"/>

  <!-- Port Pin Indicators -->
  <circle cx="180" cy="100" r="3" fill="#2563eb"/>
  <circle cx="180" cy="140" r="3" fill="#2563eb"/>
  <circle cx="180" cy="180" r="3" fill="#2563eb"/>
  <circle cx="180" cy="220" r="3" fill="#2563eb"/>
  <circle cx="540" cy="160" r="3" fill="#2563eb"/>
</svg>
