<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="100%">
  <defs>
    <!-- Grid pattern for background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>

    <!-- Shadow filter for main block -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" fill="#f8fafc" rx="8"/>
  <rect width="720" height="320" fill="url(#grid)" rx="8"/>

  <!-- Main Module Box -->
  <rect x="180" y="40" width="360" height="240" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#drop-shadow)"/>
  <rect x="180" y="40" width="360" height="36" rx="12" fill="#dbeafe"/>
  <rect x="180" y="64" width="360" height="12" fill="#dbeafe"/>

  <!-- Module Header Label -->
  <text x="360" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">or2</text>

  <!-- INPUT: a -->
  <path d="M 60 110 L 178 110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="102" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">a</text>
  <text x="188" y="114" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">a</text>

  <!-- INPUT: b -->
  <path d="M 60 210 L 178 210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="202" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">b</text>
  <text x="188" y="214" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">b</text>

  <!-- OUTPUT: out -->
  <path d="M 540 160 L 658 160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="532" y="164" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">out</text>
  <text x="653" y="152" font-family="monospace" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="end">out</text>

  <!-- INTERNAL ROUTING TO OR GATE -->
  <!-- Wire from 'a' (y=110) to upper OR input pin (y=135) -->
  <path d="M 180 110 L 240 110 L 240 135 L 300 135" stroke="#475569" stroke-width="2" fill="none"/>
  
  <!-- Wire from 'b' (y=210) to lower OR input pin (y=185) -->
  <path d="M 180 210 L 260 210 L 260 185 L 300 185" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- 2-Input OR Gate Shape -->
  <g transform="translate(300, 120)">
    <path d="M 0 0 C 12 0, 25 10, 35 15 C 45 15, 55 25, 55 25 C 55 25, 45 35, 35 35 C 25 40, 12 50, 0 50 C 10 35, 10 15, 0 0 Z" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
    <text x="22" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">≥1</text>
  </g>

  <!-- Wire: OR Gate Output -> Module Output Port -->
  <path d="M 355 160 L 540 160" stroke="#475569" stroke-width="2"/>

  <!-- Port Pin Indicators -->
  <circle cx="180" cy="110" r="3" fill="#2563eb"/>
  <circle cx="180" cy="210" r="3" fill="#2563eb"/>
  <circle cx="540" cy="160" r="3" fill="#2563eb"/>
</svg>
