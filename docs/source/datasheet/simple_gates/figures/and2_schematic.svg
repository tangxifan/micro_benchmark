<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <!-- Grid pattern for background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>

    <!-- Shadow filter for main block -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#f8fafc" rx="8"/>
  <rect width="700" height="320" fill="url(#grid)" rx="8"/>

  <!-- Main Module Box -->
  <rect x="220" y="50" width="260" height="220" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#drop-shadow)"/>
  <rect x="220" y="50" width="260" height="36" rx="12" fill="#dbeafe"/>
  <rect x="220" y="74" width="260" height="12" fill="#dbeafe"/>

  <!-- Module Header Label -->
  <text x="350" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">and2</text>

  <!-- INPUT: a -->
  <path d="M 80 130 L 218 130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="85" y="122" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">a</text>
  <text x="228" y="134" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">a</text>

  <!-- INPUT: b -->
  <path d="M 80 190 L 218 190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="85" y="182" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">b</text>
  <text x="228" y="194" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">b</text>

  <!-- OUTPUT: c / out -->
  <path d="M 480 160 L 618 160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="472" y="164" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">out</text>
  <text x="613" y="152" font-family="monospace" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="end">out</text>

  <!-- Internal Gate Representation (AND Gate Icon) -->
  <g transform="translate(315, 120)">
    <!-- Standard AND Gate Symbol -->
    <path d="M 10 10 L 35 10 C 55 10, 65 20, 65 40 C 65 60, 55 70, 35 70 L 10 70 Z" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
    <text x="32" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">&amp;</text>
  </g>

  <!-- Decorative Port Pin Circles -->
  <circle cx="220" cy="130" r="3" fill="#2563eb"/>
  <circle cx="220" cy="190" r="3" fill="#2563eb"/>
  <circle cx="480" cy="160" r="3" fill="#2563eb"/>
</svg>
