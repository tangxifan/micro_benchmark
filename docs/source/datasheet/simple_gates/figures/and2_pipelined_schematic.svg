<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <!-- Grid pattern for background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>

    <!-- Shadow filter for main block -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="400" fill="#f8fafc" rx="8"/>
  <rect width="840" height="400" fill="url(#grid)" rx="8"/>

  <!-- Main Module Box -->
  <rect x="180" y="40" width="480" height="320" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#drop-shadow)"/>
  <rect x="180" y="40" width="480" height="36" rx="12" fill="#dbeafe"/>
  <rect x="180" y="64" width="480" height="12" fill="#dbeafe"/>

  <!-- Module Header Label -->
  <text x="420" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">and2_pipelined</text>

  <!-- INPUT: a -->
  <path d="M 60 110 L 178 110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="102" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">a</text>
  <text x="188" y="114" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">a</text>

  <!-- INPUT: b -->
  <path d="M 60 210 L 178 210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="202" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">b</text>
  <text x="188" y="214" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">b</text>

  <!-- INPUT: clk -->
  <path d="M 60 310 L 178 310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="302" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">clk</text>
  <text x="188" y="314" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">clk</text>

  <!-- OUTPUT: out -->
  <path d="M 660 170 L 778 170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="652" y="174" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">out</text>
  <text x="773" y="162" font-family="monospace" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="end">out</text>

  <!-- 1. Input Register for 'a' -->
  <rect x="230" y="90" width="60" height="60" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="260" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">REG</text>
  <text x="236" y="108" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">D</text>
  <text x="236" y="142" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">C</text>
  <text x="284" y="130" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">Q</text>
  <!-- Clock triangle -->
  <path d="M 230 138 L 236 142 L 230 146" fill="none" stroke="#475569" stroke-width="1.2"/>

  <!-- Wire: 'a' Port -> Input Register 'a' -->
  <path d="M 180 110 L 228 110" stroke="#475569" stroke-width="2"/>

  <!-- 2. Input Register for 'b' -->
  <rect x="230" y="190" width="60" height="60" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="260" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">REG</text>
  <text x="236" y="208" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">D</text>
  <text x="236" y="242" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">C</text>
  <text x="284" y="230" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">Q</text>
  <!-- Clock triangle -->
  <path d="M 230 238 L 236 242 L 230 246" fill="none" stroke="#475569" stroke-width="1.2"/>

  <!-- Wire: 'b' Port -> Input Register 'b' -->
  <path d="M 180 210 L 228 210" stroke="#475569" stroke-width="2"/>

  <!-- Clock Distribution Tree -->
  <path d="M 180 310 L 210 310 L 210 142 L 228 142" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 210 242 L 228 242" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 210 310 L 500 310 L 500 215 L 518 215" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Wire: Reg 'a' Q -> AND Gate Pin 1 -->
  <path d="M 290 120 L 330 120 L 330 131 L 350 131" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Wire: Reg 'b' Q -> AND Gate Pin 2 -->
  <path d="M 290 220 L 330 220 L 330 153 L 350 153" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- 3. AND Gate -->
  <g transform="translate(350, 120)">
    <path d="M 0 0 L 20 0 C 35 0, 45 8, 45 22 C 45 36, 35 44, 20 44 L 0 44 Z" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
    <text x="18" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">&amp;</text>
  </g>

  <!-- Wire: AND Gate Output -> Output Pipeline Register D Input -->
  <path d="M 395 142 L 518 142" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Output Pipeline Register -->
  <rect x="520" y="110" width="70" height="120" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="555" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">REG</text>
  <text x="528" y="138" font-family="monospace" font-size="10" fill="#64748b" text-anchor="start">D</text>
  <text x="528" y="219" font-family="monospace" font-size="10" fill="#64748b" text-anchor="start">CLK</text>
  <text x="582" y="174" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">Q</text>
  <!-- Clock triangle symbol -->
  <path d="M 520 210 L 528 215 L 520 220" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Wire: Output Register Q -> Module Output Port -->
  <path d="M 590 170 L 660 170" stroke="#475569" stroke-width="2"/>

  <!-- Port Pin Indicators -->
  <circle cx="180" cy="110" r="3" fill="#2563eb"/>
  <circle cx="180" cy="210" r="3" fill="#2563eb"/>
  <circle cx="180" cy="310" r="3" fill="#2563eb"/>
  <circle cx="660" cy="170" r="3" fill="#2563eb"/>
</svg>
