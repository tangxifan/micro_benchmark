<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #212529; stroke-width: 2; }
      .subbox { fill: #ffffff; stroke: #495057; stroke-dasharray: 4; stroke-width: 1.5; }
      .text-title { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #212529; }
      .text-sub { font-family: sans-serif; font-weight: bold; font-size: 13px; fill: #343a40; }
      .text-port { font-family: monospace; font-size: 12px; fill: #212529; }
      .line { stroke: #212529; stroke-width: 1.5; fill: none; }
      .bus { stroke: #212529; stroke-width: 3; fill: none; }
      .arrow { fill: #212529; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- Main Module Box -->
  <rect x="180" y="20" width="360" height="340" rx="8" class="box"/>
  <text x="360" y="45" text-anchor="middle" class="text-title">counter8_4clk_async_reset</text>

  <!-- Internal Counter Blocks -->
  <g>
    <!-- Counter 0 -->
    <rect x="220" y="65" width="280" height="55" rx="4" class="subbox"/>
    <text x="360" y="98" text-anchor="middle" class="text-sub">8-bit Counter (clk0)</text>

    <!-- Counter 1 -->
    <rect x="220" y="135" width="280" height="55" rx="4" class="subbox"/>
    <text x="360" y="168" text-anchor="middle" class="text-sub">8-bit Counter (clk1)</text>

    <!-- Counter 2 -->
    <rect x="220" y="205" width="280" height="55" rx="4" class="subbox"/>
    <text x="360" y="238" text-anchor="middle" class="text-sub">8-bit Counter (clk2)</text>

    <!-- Counter 3 -->
    <rect x="220" y="275" width="280" height="55" rx="4" class="subbox"/>
    <text x="360" y="308" text-anchor="middle" class="text-sub">8-bit Counter (clk3)</text>
  </g>

  <!-- Inputs -->
  <!-- Clocks -->
  <path d="M 80 80 L 220 80" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="84" text-anchor="end" class="text-port">clk0</text>

  <path d="M 80 150 L 220 150" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="154" text-anchor="end" class="text-port">clk1</text>

  <path d="M 80 220 L 220 220" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="224" text-anchor="end" class="text-port">clk2</text>

  <path d="M 80 290 L 220 290" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="294" text-anchor="end" class="text-port">clk3</text>

  <!-- Reset (Shared) -->
  <path d="M 120 345 L 120 100 L 220 100" class="line"/>
  <path d="M 120 170 L 220 170" class="line"/>
  <path d="M 120 240 L 220 240" class="line"/>
  <path d="M 120 310 L 220 310" class="line"/>
  <circle cx="120" cy="170" r="3" fill="#212529"/>
  <circle cx="120" cy="240" r="3" fill="#212529"/>
  <circle cx="120" cy="310" r="3" fill="#212529"/>
  <path d="M 80 345 L 120 345" class="line"/>
  <text x="75" y="349" text-anchor="end" class="text-port">reset</text>

  <!-- Outputs (8-bit buses) -->
  <path d="M 500 80 L 640 80" class="bus" marker-end="url(#arrow)"/>
  <text x="645" y="84" text-anchor="start" class="text-port">result0 [7:0]</text>

  <path d="M 500 150 L 640 150" class="bus" marker-end="url(#arrow)"/>
  <text x="645" y="154" text-anchor="start" class="text-port">result1 [7:0]</text>

  <path d="M 500 220 L 640 220" class="bus" marker-end="url(#arrow)"/>
  <text x="645" y="224" text-anchor="start" class="text-port">result2 [7:0]</text>

  <path d="M 500 290 L 640 290" class="bus" marker-end="url(#arrow)"/>
  <text x="645" y="294" text-anchor="start" class="text-port">result3 [7:0]</text>
</svg>
