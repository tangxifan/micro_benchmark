<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-clk { fill: none; stroke: #ef4444; stroke-width: 2; }
      .wire-rst { fill: none; stroke: #eab308; stroke-width: 2; }
      .arrow { fill: #64748b; }
      .arrow-clk { fill: #ef4444; }
      .arrow-rst { fill: #eab308; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-clk" />
    </marker>
    <marker id="arrow-rst" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-rst" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="50" y="30" width="750" height="360" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="70" y="55" class="title">rst_on_lut Architecture</text>

  <!-- Inputs -->
  <!-- rst -->
  <line x1="30" y1="100" x2="280" y2="100" class="wire-rst" />
  <!-- Branch to Register rst -->
  <line x1="280" y1="100" x2="520" y2="100" class="wire-rst" marker-end="url(#arrow-rst)" />
  <!-- Branch down to LUT out -->
  <line x1="280" y1="100" x2="280" y2="300" class="wire-rst" />
  <line x1="280" y1="300" x2="520" y2="300" class="wire-rst" marker-end="url(#arrow-rst)" />
  <text x="40" y="92" fill="#d97706" font-family="-apple-system, sans-serif" font-size="11px">rst</text>

  <!-- clk -->
  <line x1="30" y1="180" x2="520" y2="180" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="40" y="172" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">clk</text>

  <!-- a -->
  <line x1="30" y1="140" x2="520" y2="140" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="132" class="port-text">a</text>

  <!-- b -->
  <line x1="30" y1="260" x2="520" y2="260" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="252" class="port-text">b</text>

  <!-- Logic Blocks -->
  <!-- Register Block (q) -->
  <rect x="520" y="80" width="180" height="120" class="module-box" />
  <rect x="520" y="80" width="180" height="25" class="header-bg" />
  <text x="610" y="97" class="label">Register (q)</text>
  <text x="535" y="130" class="port-text">if (rst) q = 0</text>
  <text x="535" y="150" class="port-text">else q = a</text>

  <!-- Combinational Logic (out) -->
  <rect x="520" y="230" width="180" height="100" class="module-box" />
  <rect x="520" y="230" width="180" height="25" class="header-bg" />
  <text x="610" y="247" class="label">LUT Logic (out)</text>
  <text x="535" y="285" class="port-text">out = b and not rst</text>

  <!-- Outputs -->
  <!-- q -->
  <line x1="700" y1="140" x2="800" y2="140" class="wire" marker-end="url(#arrow)" />
  <text x="720" y="132" class="port-text">q</text>

  <!-- out -->
  <line x1="700" y1="280" x2="800" y2="280" class="wire" marker-end="url(#arrow)" />
  <text x="720" y="272" class="port-text">out</text>
</svg>