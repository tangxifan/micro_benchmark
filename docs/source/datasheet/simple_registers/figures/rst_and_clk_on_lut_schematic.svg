<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-clk { fill: none; stroke: #ef4444; stroke-width: 2; }
      .wire-rst { fill: none; stroke: #eab308; stroke-width: 2; }
      .arrow { fill: #64748b; }
      .arrow-clk { fill: #ef4444; }
      .arrow-rst { fill: #eab308; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-clk" />
    </marker>
    <marker id="arrow-rst" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-rst" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="30" y="20" width="890" height="500" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="50" y="45" class="title">rst_and_clk_on_lut Architecture</text>

  <!-- ==================== INPUTS ==================== -->
  <!-- rst (Top control wire) -->
  <line x1="30" y1="80" x2="300" y2="80" class="wire-rst" />
  <!-- Branch down to LUT out0 -->
  <line x1="300" y1="80" x2="300" y2="280" class="wire-rst" />
  <line x1="300" y1="280" x2="560" y2="280" class="wire-rst" marker-end="url(#arrow-rst)" />
  <!-- Branch right to Register rst -->
  <line x1="300" y1="80" x2="560" y2="80" class="wire-rst" marker-end="url(#arrow-rst)" />
  <text x="40" y="70" fill="#d97706" font-family="-apple-system, sans-serif" font-size="11px">rst</text>

  <!-- clk (Middle control wire) -->
  <line x1="30" y1="180" x2="240" y2="180" class="wire-clk" />
  <!-- Branch to Register clk -->
  <line x1="240" y1="180" x2="240" y2="150" class="wire-clk" />
  <line x1="240" y1="150" x2="560" y2="150" class="wire-clk" marker-end="url(#arrow-clk)" />
  <!-- Branch to LUT out1 -->
  <line x1="240" y1="180" x2="240" y2="440" class="wire-clk" />
  <line x1="240" y1="440" x2="560" y2="440" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="40" y="170" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">clk</text>

  <!-- Data a -->
  <line x1="30" y1="110" x2="560" y2="110" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="102" class="port-text">a</text>

  <!-- Data b -->
  <line x1="30" y1="240" x2="560" y2="240" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="232" class="port-text">b</text>

  <!-- Data c -->
  <line x1="30" y1="400" x2="560" y2="400" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="392" class="port-text">c</text>

  <!-- ==================== LOGIC BLOCKS ==================== -->
  <!-- Async Register q -->
  <rect x="560" y="60" width="180" height="110" class="module-box" />
  <rect x="560" y="60" width="180" height="25" class="header-bg" />
  <text x="650" y="77" class="label">Register (q)</text>
  <text x="575" y="105" class="port-text">if (rst) q <= 0</text>
  <text x="575" y="125" class="port-text">else q <= a</text>

  <!-- LUT out0 Block -->
  <rect x="560" y="210" width="180" height="100" class="module-box" />
  <rect x="560" y="210" width="180" height="25" class="header-bg" />
  <text x="650" y="227" class="label">LUT (out0)</text>
  <text x="575" y="265" class="port-text">out0 = b & ~rst</text>

  <!-- LUT out1 Block -->
  <rect x="560" y="370" width="180" height="100" class="module-box" />
  <rect x="560" y="370" width="180" height="25" class="header-bg" />
  <text x="650" y="387" class="label">LUT (out1)</text>
  <text x="575" y="425" class="port-text">out1 = c & ~clk</text>

  <!-- ==================== OUTPUTS ==================== -->
  <!-- q -->
  <line x1="740" y1="110" x2="890" y2="110" class="wire" marker-end="url(#arrow)" />
  <text x="800" y="100" class="port-text">q</text>

  <!-- out0 -->
  <line x1="740" y1="260" x2="890" y2="260" class="wire" marker-end="url(#arrow)" />
  <text x="800" y="250" class="port-text">out0</text>

  <!-- out1 -->
  <line x1="740" y1="420" x2="890" y2="420" class="wire" marker-end="url(#arrow)" />
  <text x="800" y="410" class="port-text">out1</text>

</svg>