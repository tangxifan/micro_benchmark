<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-clk { fill: none; stroke: #ef4444; stroke-width: 2; }
      .arrow { fill: #64748b; }
      .arrow-clk { fill: #ef4444; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-clk" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="50" y="30" width="750" height="360" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="70" y="55" class="title">clk_cond Architecture</text>

  <!-- Inputs -->
  <!-- clk_i -->
  <line x1="30" y1="110" x2="180" y2="110" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="40" y="102" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">clk_i</text>

  <!-- clk_cond_i -->
  <line x1="30" y1="160" x2="180" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="152" class="port-text">clk_cond_i</text>

  <!-- d_i -->
  <line x1="30" y1="280" x2="520" y2="280" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="272" class="port-text">d_i</text>

  <!-- Clock Gating AND Logic Block -->
  <rect x="180" y="80" width="180" height="110" class="module-box" />
  <rect x="180" y="80" width="180" height="25" class="header-bg" />
  <text x="270" y="97" class="label">Clock Gating Logic</text>
  <text x="195" y="130" class="port-text">int_clk = clk_cond_i & clk_i</text>

  <!-- Conditioned Internal Clock Output Path -->
  <line x1="360" y1="135" x2="520" y2="135" class="wire-clk" />
  <line x1="520" y1="135" x2="520" y2="230" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="375" y="127" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">int_clk (conditioned clock)</text>

  <!-- Register Block (q_o) -->
  <rect x="460" y="230" width="180" height="100" class="module-box" />
  <rect x="460" y="230" width="180" height="25" class="header-bg" />
  <text x="550" y="247" class="label">Register (q_o)</text>
  <text x="475" y="310" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="10px">Trigger: @(posedge int_clk)</text>

  <!-- Output Path -->
  <line x1="640" y1="280" x2="800" y2="280" class="wire" marker-end="url(#arrow)" />
  <text x="660" y="272" class="port-text">q_o</text>

</svg>