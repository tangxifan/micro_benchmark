<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="100%" height="100%">
  <style>
    .outer-box { fill: #f4f6f8; stroke: #b0bec5; stroke-width: 2px; rx: 4px; }
    .block { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2px; rx: 3px; }
    .line-clk { stroke: #2e7d32; stroke-width: 2px; fill: none; }
    .line-en { stroke: #0288d1; stroke-width: 2px; fill: none; }
    .line-period { stroke: #f57c00; stroke-width: 2px; fill: none; }
    .line-reset { stroke: #d32f2f; stroke-width: 2px; fill: none; }
    .line-out { stroke: #37474f; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
    .label { font-family: monospace; font-size: 10px; fill: #333; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#37474f"/>
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#0288d1"/>
    </marker>
    <marker id="arrow-period" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#f57c00"/>
    </marker>
    <marker id="arrow-reset" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 2 0 L 8 0 L 5 8 z" fill="#d32f2f"/>
    </marker>
  </defs>

  <!-- Outer Module Boundary -->
  <rect x="110" y="40" width="560" height="420" class="outer-box" />

  <!-- Internal Timer Blocks -->
  <rect x="280" y="80" width="300" height="60" class="block" />
  <text x="430" y="115" font-family="sans-serif" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Timer Channel 0</text>

  <rect x="280" y="180" width="300" height="60" class="block" />
  <text x="430" y="215" font-family="sans-serif" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Timer Channel 1</text>

  <rect x="280" y="320" width="300" height="60" class="block" />
  <text x="430" y="355" font-family="sans-serif" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Timer Channel N-1</text>

  <!-- Ellipsis for N instances -->
  <circle cx="430" cy="270" r="3" fill="#78909c"/>
  <circle cx="430" cy="285" r="3" fill="#78909c"/>
  <circle cx="430" cy="300" r="3" fill="#78909c"/>

  <!-- Clock Inputs (Left -> Blocks) -->
  <path d="M 40 95 L 280 95" class="line-clk" marker-end="url(#arrow-clk)" />
  <text x="45" y="88" class="label" fill="#2e7d32">clk[0]</text>

  <path d="M 40 195 L 280 195" class="line-clk" marker-end="url(#arrow-clk)" />
  <text x="45" y="188" class="label" fill="#2e7d32">clk[1]</text>

  <path d="M 40 335 L 280 335" class="line-clk" marker-end="url(#arrow-clk)" />
  <text x="45" y="328" class="label" fill="#2e7d32">clk[N-1]</text>

  <!-- Reset Tree (Bottom -> Branching up to blocks) -->
  <path d="M 220 460 L 220 130" class="line-reset" />
  <path d="M 220 130 L 280 130" class="line-reset" marker-end="url(#arrow-reset)" />
  <path d="M 220 230 L 280 230" class="line-reset" marker-end="url(#arrow-reset)" />
  <path d="M 220 370 L 280 370" class="line-reset" marker-end="url(#arrow-reset)" />
  <text x="225" y="445" class="label" fill="#d32f2f">reset (async)</text>

  <!-- Outputs (Blocks -> Right) -->
  <path d="M 580 95 L 700 95" class="line-out" />
  <text x="590" y="87" class="label">count[7:0], timer_done[0]</text>

  <path d="M 580 195 L 700 195" class="line-out" />
  <text x="590" y="187" class="label">count[15:8], timer_done[1]</text>

  <path d="M 580 335 L 700 335" class="line-out" />
  <text x="590" y="327" class="label">count[N*8-1:(N-1)*8], timer_done[N-1]</text>

</svg>
