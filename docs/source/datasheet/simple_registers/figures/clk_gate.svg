<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="andGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-wire" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>

    <marker id="arrow-rst" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="400" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    clk_gate Architecture
  </text>
  <text x="400" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Synchronous Enable Register with Clock-Gated AND Gate
  </text>

  <!-- Main Module Container -->
  <rect x="120" y="80" width="560" height="270" rx="10" fill="url(#moduleGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#1d4ed8">
    clk_gate (Top)
  </text>

  <!-- Control Flip-Flop (q) -->
  <rect x="250" y="140" width="120" height="110" rx="6" fill="url(#regGrad)" stroke="#7c3aed" stroke-width="1.5" />
  <text x="310" y="170" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">q</text>
  <text x="310" y="190" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">D Flip-Flop</text>
  <path d="M 250 220 L 260 220 L 255 213 Z" fill="none" stroke="#ea580c" stroke-width="1" />

  <!-- AND2 Gate -->
  <g transform="translate(480, 165)">
    <path d="M 0 0 L 30 0 C 55 0, 55 50, 30 50 L 0 50 Z" fill="url(#andGrad)" stroke="#0284c7" stroke-width="1.5" />
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">&</text>
  </g>

  <!-- External Inputs -->
  <!-- rst_i -->
  <path d="M 40 160 L 250 160" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-rst)" />
  <text x="50" y="152" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#dc2626">rst_i</text>

  <!-- clk_i -->
  <path d="M 40 220 L 250 220" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-clk)" />
  <text x="50" y="212" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#c2410c">clk_i</text>

  <!-- data_i -->
  <path d="M 40 300 L 450 300 L 450 200 L 480 200" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-wire)" />
  <text x="50" y="292" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">data_i</text>

  <!-- Internal Bus Connections -->
  <!-- q -> AND Gate Input -->
  <path d="M 370 180 L 480 180" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-wire)" />
  <text x="425" y="172" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#6d28d9" text-anchor="middle">q</text>

  <!-- AND Gate Output -> data_o -->
  <path d="M 533 190 L 760 190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-wire)" />
  <text x="750" y="182" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">data_o</text>

  <!-- Legend -->
  <g transform="translate(180, 380)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="1.5" />
    <text x="28" y="4" font-family="sans-serif" font-size="10" fill="#334155">Data Line</text>

    <line x1="130" y1="0" x2="150" y2="0" stroke="#ea580c" stroke-width="1.5" />
    <text x="158" y="4" font-family="sans-serif" font-size="10" fill="#334155">Clock Input (clk_i)</text>

    <line x1="290" y1="0" x2="310" y2="0" stroke="#dc2626" stroke-width="1.5" />
    <text x="318" y="4" font-family="sans-serif" font-size="10" fill="#334155">Sync Reset (rst_i)</text>
  </g>
</svg>