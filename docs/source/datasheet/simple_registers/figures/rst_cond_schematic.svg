<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-clk { fill: none; stroke: #ef4444; stroke-width: 2; }
      .wire-rst { fill: none; stroke: #eab308; stroke-width: 2; }
      .arrow { fill: #64748b; }
      .arrow-clk { fill: #ef4444; }
      .arrow-rst { fill: #eab308; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-clk" />
    </marker>
    <marker id="arrow-rst" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-rst" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="50" y="30" width="750" height="360" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="70" y="55" class="title">rst_cond Architecture</text>

  <!-- Inputs -->
  <!-- rst_i -->
  <line x1="30" y1="110" x2="180" y2="110" class="wire-rst" marker-end="url(#arrow-rst)" />
  <text x="40" y="102" fill="#d97706" font-family="-apple-system, sans-serif" font-size="11px">rst_i</text>

  <!-- rst_cond_i -->
  <line x1="30" y1="160" x2="180" y2="160" class="wire-rst" marker-end="url(#arrow-rst)" />
  <text x="40" y="152" fill="#d97706" font-family="-apple-system, sans-serif" font-size="11px">rst_cond_i</text>

  <!-- clk_i -->
  <line x1="30" y1="310" x2="520" y2="310" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="40" y="302" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">clk_i</text>

  <!-- d_i -->
  <line x1="30" y1="260" x2="520" y2="260" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="252" class="port-text">d_i</text>

  <!-- Reset Gating AND Logic Block -->
  <rect x="180" y="80" width="180" height="110" class="module-box" />
  <rect x="180" y="80" width="180" height="25" class="header-bg" />
  <text x="270" y="97" class="label">Reset Gating Logic</text>
  <text x="195" y="130" class="port-text">int_rst = rst_cond_i and rst_i</text>

  <!-- Conditioned Internal Reset Output Path -->
  <line x1="360" y1="135" x2="520" y2="135" class="wire-rst" />
  <line x1="520" y1="135" x2="520" y2="210" class="wire-rst" marker-end="url(#arrow-rst)" />
  <text x="375" y="127" fill="#d97706" font-family="-apple-system, sans-serif" font-size="11px">int_rst (conditioned reset)</text>

  <!-- Register Block (q_o) -->
  <rect x="520" y="210" width="180" height="120" class="module-box" />
  <rect x="520" y="210" width="180" height="25" class="header-bg" />
  <text x="610" y="227" class="label">Register (q_o)</text>
  <text x="535" y="260" class="port-text">if (int_rst) q_o = 0</text>
  <text x="535" y="280" class="port-text">else q_o = d_i</text>

  <!-- Output Path -->
  <line x1="700" y1="270" x2="800" y2="270" class="wire" marker-end="url(#arrow)" />
  <text x="720" y="262" class="port-text">q_o</text>
</svg>