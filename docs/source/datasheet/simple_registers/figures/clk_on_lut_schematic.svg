<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-clk { fill: none; stroke: #ef4444; stroke-width: 2; }
      .arrow { fill: #64748b; }
      .arrow-clk { fill: #ef4444; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-clk" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="50" y="30" width="750" height="390" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="70" y="55" class="title">clk_on_lut Architecture</text>

  <!-- Inputs -->
  <!-- clk (split to sequential and combinatorial paths) -->
  <line x1="30" y1="120" x2="200" y2="120" class="wire-clk" />
  <!-- Branch to Register -->
  <line x1="200" y1="120" x2="200" y2="300" class="wire-clk" />
  <line x1="200" y1="300" x2="480" y2="300" class="wire-clk" marker-end="url(#arrow-clk)" />
  <!-- Branch to LUT / AND gate -->
  <line x1="200" y1="120" x2="480" y2="120" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="40" y="112" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">clk (clock / data input)</text>

  <!-- Input a -->
  <line x1="30" y1="260" x2="480" y2="260" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="252" class="port-text">a</text>

  <!-- Input b -->
  <line x1="30" y1="160" x2="480" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="152" class="port-text">b</text>

  <!-- Combinatorial Logic Block (LUT / AND Gate) -->
  <rect x="480" y="80" width="180" height="110" class="module-box" />
  <rect x="480" y="80" width="180" height="25" class="header-bg" />
  <text x="570" y="97" class="label">Combinational LUT</text>
  <text x="495" y="130" class="port-text">out = b & clk</text>

  <!-- Synchronous Register Block -->
  <rect x="480" y="230" width="180" height="110" class="module-box" />
  <rect x="480" y="230" width="180" height="25" class="header-bg" />
  <text x="570" y="247" class="label">Flip-Flop Register</text>
  <text x="495" y="280" class="port-text">q <= a</text>
  <text x="495" y="325" fill="#ef4444" font-size="10px">Clock: @(posedge clk)</text>

  <!-- Outputs -->
  <!-- out -->
  <line x1="660" y1="135" x2="780" y2="135" class="wire" marker-end="url(#arrow)" />
  <text x="680" y="127" class="port-text">out</text>

  <!-- q -->
  <line x1="660" y1="285" x2="780" y2="285" class="wire" marker-end="url(#arrow)" />
  <text x="680" y="277" class="port-text">q</text>

</svg>