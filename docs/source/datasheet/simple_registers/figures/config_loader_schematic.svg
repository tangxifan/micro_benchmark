<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 6; ry: 6; }
      .subbox { fill: #e9ecef; stroke: #495057; stroke-width: 1.5; rx: 4; ry: 4; }
      .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 12px; font-style: italic; fill: #6c757d; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 11px; fill: #333; }
      .wire { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire-no-arrow { fill: none; stroke: #333; stroke-width: 1.5; }
      .gate { fill: #fff; stroke: #333; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top-Level Boundary (configuration_manager) -->
  <rect x="40" y="40" width="770" height="440" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="6,6" rx="8"/>
  <text x="425" y="65" class="title">configuration_manager</text>

  <!-- Submodule: clock_divider -->
  <rect x="150" y="100" width="220" height="110" class="box"/>
  <text x="260" y="125" class="title">prog_clk_divider</text>
  <text x="260" y="142" class="subtitle">(clock_divider)</text>
  <text x="160" y="175" class="label">clk_in</text>
  <text x="320" y="175" class="label">prog_clk_out</text>

  <!-- Submodule: reset_generator -->
  <rect x="150" y="250" width="220" height="110" class="box"/>
  <text x="260" y="275" class="title">prog_reset_generator</text>
  <text x="260" y="292" class="subtitle">(reset_generator)</text>
  <text x="160" y="325" class="label">~prog_clk</text>
  <text x="320" y="325" class="label">prog_reset</text>

  <!-- Submodule: bitstream_loader -->
  <rect x="470" y="100" width="280" height="310" class="box"/>
  <text x="610" y="125" class="title">loader</text>
  <text x="610" y="142" class="subtitle">(bitstream_loader)</text>
  
  <!-- Internal EFX_RAM_5K -->
  <rect x="500" y="210" width="220" height="130" class="subbox"/>
  <text x="610" y="235" class="title" style="font-size: 14px;">EFX_RAM_5K_inst</text>
  <text x="610" y="252" class="subtitle" style="font-size: 10px;">(EFX_RAM_5K)</text>
  <text x="510" y="285" class="label">RADDR / RCLK</text>
  <text x="655" y="285" class="label">RDATA</text>

  <!-- External Inputs / Ports (Left) -->
  <text x="60" y="175" class="label" font-weight="bold">clk_in</text>
  <path d="M 95 170 L 150 170" class="wire"/>

  <!-- External Outputs / Ports (Right) -->
  <!-- prog_reset -->
  <path d="M 370 320 L 790 320" class="wire"/>
  <text x="735" y="312" class="label" font-weight="bold">prog_reset</text>

  <!-- configuration_done -->
  <path d="M 750 200 L 790 200" class="wire"/>
  <text x="670" y="192" class="label">done</text>
  <text x="700" y="445" class="label" font-weight="bold">configuration_done</text>
  <path d="M 750 200 L 750 445 L 790 445" class="wire"/>

  <!-- prog_clk logic & output -->
  <!-- Logic gate representation for prog_clk gating -->
  <path d="M 390 170 L 420 170" class="wire"/>
  <text x="705" y="162" class="label">prog_clk</text>
  <path d="M 750 170 L 790 170" class="wire"/>

  <!-- ccff_head logic & output -->
  <text x="730" y="380" class="label" font-weight="bold">ccff_head</text>
  <path d="M 750 385 L 790 385" class="wire"/>
  <path d="M 700 385 L 750 385" class="wire"/>
  <text x="660" y="377" class="label">ccff_head_out</text>

  <!-- Inter-module wiring connections -->
  <!-- clock_divider out to prog_clk logic -->
  <path d="M 370 170 L 390 170" class="wire-no-arrow"/>

  <!-- reset_generator clk input feed -->
  <path d="M 420 170 L 420 230 L 120 230 L 120 320 L 150 320" class="wire"/>
  <text x="105" y="222" class="label">~prog_clk</text>

  <!-- loader start input connected to ~prog_reset -->
  <path d="M 370 325 L 440 325 L 440 350 L 470 350" class="wire"/>
  <text x="415" y="342" class="label">start (~prog_reset)</text>

  <!-- loader config_chain_head output -->
  <path d="M 750 240 L 770 240 L 770 385 L 750 385" class="wire-no-arrow"/>

</svg>
