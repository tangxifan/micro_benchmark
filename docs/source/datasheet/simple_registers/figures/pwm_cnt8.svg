<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="subCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="425" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    pwm_cnt8 Architecture
  </text>
  <text x="425" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    PWM Generator Based on Hard Counter (cnt_8) with Match References
  </text>

  <!-- Main Module Container: pwm_cnt8 -->
  <rect x="120" y="80" width="610" height="350" rx="10" fill="url(#moduleGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="105" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#1d4ed8">
    pwm_cnt8 (Top)
  </text>

  <!-- Inner Sub-Core: cnt_8 -->
  <rect x="250" y="130" width="370" height="260" rx="6" fill="url(#subCoreGrad)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="435" y="155" font-family="monospace, &#39;Courier New&#39;" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle">
    CNT0 : cnt_8
  </text>
  <text x="435" y="172" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#64748b" text-anchor="middle">
    MATCH0_REF=8'b11000000, MATCH1_REF=8'b11110000
  </text>

  <!-- Counter Register Block Inside cnt_8 -->
  <rect x="330" y="210" width="210" height="70" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="435" y="238" font-family="monospace, &#39;Courier New&#39;" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">q_reg [7:0]</text>
  <text x="435" y="258" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Synchronous 8-bit Up-Counter</text>

  <!-- Top-Level Inputs -->
  <!-- clk -->
  <path d="M 40 180 L 250 180" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-clk)" />
  <text x="50" y="173" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#c2410c">clk</text>

  <!-- reset -->
  <path d="M 40 245 L 330 245" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="50" y="238" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#0369a1">reset</text>

  <!-- Top-Level Outputs -->
  <!-- m0_out -->
  <path d="M 540 330 L 790 330" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <text x="780" y="322" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">m0_out</text>

  <!-- m1_out -->
  <path d="M 540 370 L 790 370" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <text x="780" y="362" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">m1_out</text>

  <!-- Internal Comparator Logic Paths -->
  <path d="M 435 280 L 435 330 L 540 330" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-bus)" />
  <path d="M 435 280 L 435 370 L 540 370" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-bus)" />
  <text x="480" y="322" font-family="sans-serif" font-size="9" fill="#475569">== MATCH0</text>
  <text x="480" y="362" font-family="sans-serif" font-size="9" fill="#475569">== MATCH1</text>

  <!-- Legend / Key -->
  <g transform="translate(180, 445)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#0284c7" stroke-width="2" />
    <text x="28" y="4" font-family="sans-serif" font-size="11" fill="#334155">Control Signal</text>

    <line x1="130" y1="0" x2="150" y2="0" stroke="#2563eb" stroke-width="2.5" />
    <text x="158" y="4" font-family="sans-serif" font-size="11" fill="#334155">Match Output</text>

    <line x1="260" y1="0" x2="280" y2="0" stroke="#ea580c" stroke-width="2" />
    <text x="288" y="4" font-family="sans-serif" font-size="11" fill="#334155">Clock</text>
  </g>
</svg>