<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #212529; stroke-width: 2; }
      .subbox { fill: #ffffff; stroke: #495057; stroke-dasharray: 4; stroke-width: 1.5; }
      .text-title { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #212529; }
      .text-sub { font-family: sans-serif; font-weight: bold; font-size: 11px; fill: #343a40; }
      .text-port { font-family: monospace; font-size: 11px; fill: #212529; }
      .line { stroke: #212529; stroke-width: 1.5; fill: none; }
      .bus { stroke: #212529; stroke-width: 3; fill: none; }
      .arrow { fill: #212529; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <rect x="200" y="20" width="400" height="240" rx="8" class="box"/>
  <text x="400" y="45" text-anchor="middle" class="text-title">timer8_4clk_async_reset</text>
  <rect x="240" y="60" width="320" height="32" rx="4" class="subbox"/>
  <text x="400" y="80" text-anchor="middle" class="text-sub">8-bit Timer (clk[0])</text>
  <path d="M 80 76 L 240 76" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="80" text-anchor="end" class="text-port">clk[0]</text>
  <path d="M 560 70 L 720 70" class="bus" marker-end="url(#arrow)"/>
  <text x="725" y="74" text-anchor="start" class="text-port">count[0] [7:0]</text>
  <path d="M 560 82 L 720 82" class="line" marker-end="url(#arrow)"/>
  <text x="725" y="86" text-anchor="start" class="text-port">timer_done[0]</text>
  <rect x="240" y="100" width="320" height="32" rx="4" class="subbox"/>
  <text x="400" y="120" text-anchor="middle" class="text-sub">8-bit Timer (clk[1])</text>
  <path d="M 80 116 L 240 116" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="120" text-anchor="end" class="text-port">clk[1]</text>
  <path d="M 560 110 L 720 110" class="bus" marker-end="url(#arrow)"/>
  <text x="725" y="114" text-anchor="start" class="text-port">count[1] [7:0]</text>
  <path d="M 560 122 L 720 122" class="line" marker-end="url(#arrow)"/>
  <text x="725" y="126" text-anchor="start" class="text-port">timer_done[1]</text>
  <rect x="240" y="140" width="320" height="32" rx="4" class="subbox"/>
  <text x="400" y="160" text-anchor="middle" class="text-sub">8-bit Timer (clk[2])</text>
  <path d="M 80 156 L 240 156" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="160" text-anchor="end" class="text-port">clk[2]</text>
  <path d="M 560 150 L 720 150" class="bus" marker-end="url(#arrow)"/>
  <text x="725" y="154" text-anchor="start" class="text-port">count[2] [7:0]</text>
  <path d="M 560 162 L 720 162" class="line" marker-end="url(#arrow)"/>
  <text x="725" y="166" text-anchor="start" class="text-port">timer_done[2]</text>
  <rect x="240" y="180" width="320" height="32" rx="4" class="subbox"/>
  <text x="400" y="200" text-anchor="middle" class="text-sub">8-bit Timer (clk[3])</text>
  <path d="M 80 196 L 240 196" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="200" text-anchor="end" class="text-port">clk[3]</text>
  <path d="M 560 190 L 720 190" class="bus" marker-end="url(#arrow)"/>
  <text x="725" y="194" text-anchor="start" class="text-port">count[3] [7:0]</text>
