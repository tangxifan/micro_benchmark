<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>

    <marker id="arrow-out" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-int" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="425" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    reset_generator Architecture
  </text>
  <text x="425" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Power-On Reset Pulse Circuit (Parameter Configurable Duration)
  </text>

  <!-- Main Module Container: reset_generator -->
  <rect x="120" y="80" width="610" height="260" rx="10" fill="url(#moduleGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#1d4ed8">
    reset_generator (Top)
  </text>

  <!-- Parameter Annotation -->
  <text x="710" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#64748b" text-anchor="end">
    INITIAL_VALUE, ACTIVE_CYCLES
  </text>

  <!-- Active Cycle Counter Block -->
  <rect x="220" y="150" width="220" height="140" rx="6" fill="url(#blockGrad)" stroke="#7c3aed" stroke-width="1.5" />
  <text x="330" y="175" font-family="monospace, &#39;Courier New&#39;" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">
    active_cycle_counter
  </text>
  <text x="330" y="195" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">
    Holds Initial Reset Level
  </text>
  <text x="330" y="220" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#0f172a" text-anchor="middle">
    == ACTIVE_CYCLES
  </text>
  <path d="M 220 250 L 235 250 L 227 242 Z" fill="none" stroke="#ea580c" stroke-width="1.5" />
  <text x="330" y="265" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    Increments on posedge clk
  </text>

  <!-- Output Pulse Toggle Stage -->
  <rect x="500" y="160" width="180" height="120" rx="6" fill="url(#blockGrad)" stroke="#0284c7" stroke-width="1.5" />
  <text x="590" y="190" font-family="monospace, &#39;Courier New&#39;" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">
    Pulse Output Register
  </text>
  <text x="590" y="215" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#334155" text-anchor="middle">
    pulse <= INITIAL_VALUE
  </text>
  <text x="590" y="245" font-family="monospace, &#39;Courier New&#39;" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">
    pulse <= ~pulse
  </text>

  <!-- Input Pin: clk -->
  <path d="M 40 250 L 220 250" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-clk)" />
  <text x="50" y="242" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#c2410c">clk</text>

  <!-- Internal Connection: Counter to Output Stage -->
  <path d="M 440 220 L 500 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-int)" />

  <!-- Output Pin: pulse -->
  <path d="M 680 220 L 790 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-out)" />
  <text x="780" y="212" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#1d4ed8" text-anchor="end">pulse</text>

  <!-- Legend / Key -->
  <g transform="translate(240, 365)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ea580c" stroke-width="2" />
    <text x="28" y="4" font-family="sans-serif" font-size="11" fill="#334155">Input Clock (clk)</text>

    <line x1="170" y1="0" x2="190" y2="0" stroke="#64748b" stroke-width="2" />
    <text x="198" y="4" font-family="sans-serif" font-size="11" fill="#334155">Internal Active Counter</text>

    <line x1="340" y1="0" x2="360" y2="0" stroke="#2563eb" stroke-width="2.5" />
    <text x="368" y="4" font-family="sans-serif" font-size="11" fill="#334155">Reset Pulse Output</text>
  </g>
</svg>