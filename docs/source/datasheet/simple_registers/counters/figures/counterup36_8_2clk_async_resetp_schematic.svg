<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#28a745"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/>
    </marker>
    <style>
      .boundary { fill: #f8f9fa; stroke: #ced4da; stroke-width: 2; rx: 8; ry: 8; }
      .subbox { fill: #e8f4fd; stroke: #007bff; stroke-width: 1.5; rx: 4; ry: 4; }
      .title { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 10px; font-style: italic; fill: #6c757d; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 12px; fill: #333; }
      .wire-green { fill: none; stroke: #28a745; stroke-width: 1.5; marker-end: url(#arrow-green); }
      .wire-red { fill: none; stroke: #d9534f; stroke-width: 1.5; marker-end: url(#arrow-red); }
      .wire-dark { fill: none; stroke: #333333; stroke-width: 1.5; marker-end: url(#arrow-dark); }
      .wire-no-arrow { fill: none; stroke: #d9534f; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Outer System Boundary -->
  <rect x="40" y="30" width="720" height="440" class="boundary"/>
  <text x="400" y="55" class="title">counterup36_8_2clk_async_resetp</text>

  <!-- ==================== STACKED SUB-BLOCKS ==================== -->
  
  <!-- Cluster Counters Block (a0) -->
  <rect x="280" y="90" width="260" height="130" class="subbox"/>
  <text x="410" y="120" class="title" font-size="12px">cluster_counters a0</text>
  <text x="410" y="137" class="subtitle">36-bit (8-bit + 12-bit + 16-bit)</text>
  <text x="410" y="155" class="subtitle">Replicated across size = 77 instances</text>

  <!-- 10-bit Counter Block (b0) -->
  <rect x="280" y="270" width="260" height="90" class="subbox"/>
  <text x="410" y="300" class="title" font-size="12px">counterup10_1clk_async_resetp b0</text>
  <text x="410" y="318" class="subtitle">Separate 10-bit Up-Counter</text>


  <!-- ==================== INPUT WIRES (LEFT) ==================== -->

  <!-- Shared Clock Input & Branching -->
  <text x="65" y="120" class="label" font-weight="bold">clock0</text>
  <path d="M 130 115 L 180 115" class="wire-no-arrow"/>
  <path d="M 180 95 L 180 300" class="wire-no-arrow"/>
  
  <!-- Branches to clock inputs -->
  <path d="M 180 135 L 280 135" class="wire-green"/>
  <path d="M 180 300 L 280 300" class="wire-green"/>


  <!-- ==================== SHARED RESET / TRUNK (BOTTOM-UP) ==================== -->

  <text x="145" y="445" class="label" font-weight="bold" fill="#d9534f">reset</text>
  <!-- Main vertical trunk coming from bottom boundary -->
  <path d="M 210 430 L 210 180" class="wire-no-arrow"/>

  <!-- Horizontal branches into each sub-block -->
  <path d="M 210 180 L 280 180" class="wire-red"/>
  <path d="M 210 335 L 280 335" class="wire-red"/>


  <!-- ==================== OUTPUT WIRES (RIGHT) ==================== -->

  <!-- Out1 (Cluster concatenation) -->
  <text x="575" y="145" class="label" font-weight="bold">out1 [(size*N)-1:0]</text>
  <path d="M 540 150 L 625 150" class="wire-dark"/>

  <!-- Out2 (10-bit counter) -->
  <text x="575" y="315" class="label" font-weight="bold">out2 [9:0]</text>
  <path d="M 540 315 L 625 315" class="wire-dark"/>

</svg>
