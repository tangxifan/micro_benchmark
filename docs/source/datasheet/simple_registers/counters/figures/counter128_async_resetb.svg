<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 4; ry: 4; }
      .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 12px; font-style: italic; fill: #6c757d; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 12px; fill: #333; }
      .pin-label { font-family: sans-serif; font-size: 11px; fill: #333; }
      .wire { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top-Level Boundary (counter128_async_resetb) -->
  <rect x="40" y="40" width="600" height="240" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="6,6" rx="8"/>
  <text x="340" y="65" class="title">counter128_async_resetb</text>

  <!-- Core Counter Component Box -->
  <rect x="220" y="90" width="240" height="150" class="box"/>
  <text x="340" y="120" class="title">Counter 128-bit</text>
  <text x="340" y="137" class="subtitle">(Async Active-Low Reset)</text>

  <!-- Input Ports (Left) -->
  <!-- clk -->
  <text x="65" y="145" class="label" font-weight="bold">clk</text>
  <path d="M 120 140 L 220 140" class="wire"/>
  <!-- Clock rising edge indicator triangle symbol -->
  <polygon points="220,135 230,140 220,145" fill="#333"/>

  <!-- resetb -->
  <text x="65" y="205" class="label" font-weight="bold">resetb</text>
  <path d="M 120 200 L 220 200" class="wire"/>
  <text x="230" y="193" class="pin-label">RESETB (Active-Low)</text>

  <!-- Output Ports (Right) -->
  <!-- result [127:0] -->
  <text x="510" y="175" class="label" font-weight="bold">result [127:0]</text>
  <path d="M 460 170 L 535 170" class="wire"/>

  <!-- Descriptive notes inside symbol/box -->
  <text x="340" y="210" class="subtitle" font-size="10px">result &lt;= ~resetb ? 0 : result + 1</text>

</svg>
