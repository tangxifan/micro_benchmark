<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#28a745"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/>
    </marker>
    <style>
      .boundary { fill: #f8f9fa; stroke: #ced4da; stroke-width: 2; rx: 8; ry: 8; }
      .subbox { fill: #e8f4fd; stroke: #007bff; stroke-width: 1.5; rx: 4; ry: 4; }
      .title { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 10px; font-style: italic; fill: #6c757d; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 12px; fill: #333; }
      .wire-green { fill: none; stroke: #28a745; stroke-width: 1.5; marker-end: url(#arrow-green); }
      .wire-red { fill: none; stroke: #d9534f; stroke-width: 1.5; marker-end: url(#arrow-red); }
      .wire-dark { fill: none; stroke: #333333; stroke-width: 1.5; marker-end: url(#arrow-dark); }
      .wire-no-arrow { fill: none; stroke: #d9534f; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Outer System Boundary -->
  <rect x="40" y="30" width="720" height="460" class="boundary"/>
  <text x="400" y="55" class="title">counterupn_1clk_dualedge_async_resetp</text>

  <!-- ==================== STACKED SUB-BLOCKS ==================== -->
  
  <!-- Positive Edge Counter Block (q_counter1) -->
  <rect x="280" y="90" width="260" height="90" class="subbox"/>
  <text x="410" y="120" class="title" font-size="12px">q_counter1 (posedge clk)</text>
  <text x="410" y="137" class="subtitle">n-bit Positive Edge Counter</text>

  <!-- Negative Edge Counter Block (q_counter2) -->
  <rect x="280" y="210" width="260" height="90" class="subbox"/>
  <text x="410" y="240" class="title" font-size="12px">q_counter2 (negedge clk)</text>
  <text x="410" y="258" class="subtitle">n-bit Negative Edge Counter</text>

  <!-- Adder Block (q_counter1 + q_counter2) -->
  <rect x="280" y="330" width="260" height="80" class="subbox"/>
  <text x="410" y="360" class="title" font-size="12px">Adder / Combiner</text>
  <text x="410" y="377" class="subtitle">q_counter = q_counter1 + q_counter2</text>


  <!-- ==================== INPUT WIRES (LEFT) ==================== -->

  <!-- Shared Clock Input & Branching -->
  <text x="65" y="120" class="label" font-weight="bold">clk</text>
  <path d="M 120 115 L 180 115" class="wire-no-arrow"/>
  <path d="M 180 95 L 180 240" class="wire-no-arrow"/>
  
  <!-- Branches to clock inputs -->
  <path d="M 180 135 L 280 135" class="wire-green"/>
  <path d="M 180 240 L 280 240" class="wire-green"/>


  <!-- ==================== SHARED RESET / TRUNK (BOTTOM-UP) ==================== -->

  <text x="135" y="465" class="label" font-weight="bold" fill="#d9534f">rst_counter</text>
  <!-- Main vertical trunk coming from bottom boundary -->
  <path d="M 210 450 L 210 165" class="wire-no-arrow"/>

  <!-- Horizontal branches into each sub-block -->
  <path d="M 210 165 L 280 165" class="wire-red"/>
  <path d="M 210 285 L 280 285" class="wire-red"/>


  <!-- ==================== INTERNAL & OUTPUT WIRES (RIGHT) ==================== -->

  <!-- Internal wires from counters to adder -->
  <path d="M 540 135 L 590 135 L 590 350 L 540 350" class="wire-dark"/>
  <text x="595" y="245" class="label">q_counter1</text>

  <path d="M 540 255 L 570 255 L 570 375 L 540 375" class="wire-dark"/>
  <text x="545" y="295" class="label">q_counter2</text>

  <!-- Final Output Wire (q_counter) -->
  <text x="615" y="360" class="label" font-weight="bold">q_counter [n-1:0]</text>
  <path d="M 540 365 L 635 365" class="wire-dark"/>

</svg>
