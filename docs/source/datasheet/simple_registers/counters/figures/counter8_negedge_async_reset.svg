<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="adderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>

    <marker id="arrow-rst" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="400" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    counter8_negedge_async_reset Architecture
  </text>
  <text x="400" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    8-bit Negative-Edge Triggered Counter with Asynchronous Reset
  </text>

  <!-- Main Module Container -->
  <rect x="120" y="80" width="560" height="270" rx="10" fill="url(#moduleGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#1d4ed8">
    counter8_negedge_async_reset (Top)
  </text>

  <!-- Increment Adder Block (+1) -->
  <rect x="230" y="145" width="100" height="90" rx="6" fill="url(#adderGrad)" stroke="#0284c7" stroke-width="1.5" />
  <text x="280" y="185" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0369a1" text-anchor="middle">+1</text>
  <text x="280" y="210" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#64748b" text-anchor="middle">Increment</text>

  <!-- 8-Bit Register (result) -->
  <rect x="420" y="140" width="140" height="110" rx="6" fill="url(#regGrad)" stroke="#7c3aed" stroke-width="1.5" />
  <text x="490" y="170" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">result[7:0]</text>
  <text x="490" y="190" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">8-Bit Register</text>

  <!-- Negedge Clock Bubble Indicator -->
  <circle cx="420" cy="220" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
  <path d="M 425 220 L 435 220 L 430 213 Z" fill="none" stroke="#ea580c" stroke-width="1" />

  <!-- External Inputs -->
  <!-- clkn -->
  <path d="M 40 220 L 415 220" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-clk)" />
  <text x="50" y="212" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#c2410c">clkn</text>

  <!-- reset (Asynchronous Reset) -->
  <path d="M 40 300 L 490 300 L 490 250" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-rst)" />
  <text x="50" y="292" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#dc2626">reset</text>

  <!-- Internal Bus Connections -->
  <!-- Adder Output -> Register Input -->
  <path d="M 330 190 L 420 190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-bus)" />
  <text x="375" y="182" font-family="monospace, &#39;Courier New&#39;" font-size="9" fill="#475569" text-anchor="middle">result + 1</text>

  <!-- Register Output -> External Port & Feedback Loop -->
  <path d="M 560 190 L 760 190" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <text x="750" y="182" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">result[7:0]</text>

  <!-- Feedback Loop back to Adder -->
  <path d="M 620 190 L 620 280 L 180 280 L 180 190 L 230 190" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-bus)" />
  <text x="380" y="272" font-family="monospace, &#39;Courier New&#39;" font-size="9" fill="#475569" text-anchor="middle">Feedback (result)</text>

  <!-- Legend -->
  <g transform="translate(180, 380)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2" />
    <text x="28" y="4" font-family="sans-serif" font-size="10" fill="#334155">Data Bus</text>

    <line x1="130" y1="0" x2="150" y2="0" stroke="#ea580c" stroke-width="1.5" />
    <text x="158" y="4" font-family="sans-serif" font-size="10" fill="#334155">Negedge Clock (clkn)</text>

    <line x1="290" y1="0" x2="310" y2="0" stroke="#dc2626" stroke-width="1.5" />
    <text x="318" y="4" font-family="sans-serif" font-size="10" fill="#334155">Async Reset (reset)</text>
  </g>
</svg>