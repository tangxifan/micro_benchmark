<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
      .port-type { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-bus { fill: none; stroke: #0284c7; stroke-width: 2.5; }
      .arrow { fill: #64748b; }
      .arrow-bus { fill: #0284c7; }
      .internal-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 4px; ry: 4px; }
      .internal-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow"/>
    </marker>
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-bus"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Module Box -->
  <rect x="220" y="60" width="260" height="320" class="module-box"/>
  <rect x="220" y="60" width="260" height="40" class="header-bg"/>
  <text x="350" y="85" class="title" text-anchor="middle">asyn_spram_4x1</text>

  <!-- Internal Logic Representation -->
  <rect x="255" y="140" width="190" height="90" class="internal-box"/>
  <text x="350" y="170" class="internal-text">Address Decoder</text>
  <text x="350" y="190" class="internal-text">&amp; Mem Array [3:0]</text>

  <rect x="255" y="260" width="190" height="70" class="internal-box"/>
  <text x="350" y="290" class="internal-text">Synchronous Write</text>
  <text x="350" y="310" class="internal-text">(posedge clk)</text>

  <!-- Input Ports (Left Side) -->
  <!-- clk -->
  <line x1="140" y1="100" x2="220" y2="100" class="wire" marker-end="url(#arrow)"/>
  <text x="150" y="93" class="port-text">clk</text>
  <text x="150" y="113" class="port-type">input</text>

  <!-- addr_0 -->
  <line x1="140" y1="160" x2="220" y2="160" class="wire" marker-end="url(#arrow)"/>
  <text x="150" y="153" class="port-text">addr_0</text>
  <text x="150" y="173" class="port-type">input</text>

  <!-- addr_1 -->
  <line x1="140" y1="220" x2="220" y2="220" class="wire" marker-end="url(#arrow)"/>
  <text x="150" y="213" class="port-text">addr_1</text>
  <text x="150" y="233" class="port-type">input</text>

  <!-- d_in -->
  <line x1="140" y1="280" x2="220" y2="280" class="wire" marker-end="url(#arrow)"/>
  <text x="150" y="273" class="port-text">d_in</text>
  <text x="150" y="293" class="port-type">input</text>

  <!-- wr_en -->
  <line x1="140" y1="340" x2="220" y2="340" class="wire" marker-end="url(#arrow)"/>
  <text x="150" y="333" class="port-text">wr_en</text>
  <text x="150" y="353" class="port-type">input</text>

  <!-- Output Ports (Right Side) -->
  <!-- d_out -->
  <line x1="480" y1="180" x2="560" y2="180" class="wire" marker-end="url(#arrow)"/>
  <text x="505" y="173" class="port-text">d_out</text>
  <text x="505" y="193" class="port-type">output</text>

</svg>
