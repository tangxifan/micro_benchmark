<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Marker / Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="400" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    dual_port_ram_8x32 Architecture
  </text>
  <text x="400" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Single Clock Synchronous Dual-Port RAM with MIF Preloading (8 x 32-bit)
  </text>

  <!-- Main Module Container: dual_port_ram_8x32 -->
  <rect x="180" y="80" width="440" height="370" rx="10" fill="url(#ramGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="200" y="105" font-family="monospace, &#39;Courier New&#39;" font-size="14" font-weight="bold" fill="#1d4ed8">
    dual_port_ram_8x32
  </text>
  <text x="590" y="105" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#475569" text-anchor="end">
    PARAMETER: MEM_FILE = "init.hex"
  </text>

  <!-- Inner Sub-Core Container: dual_port_sram_8x32_core -->
  <rect x="250" y="130" width="300" height="300" rx="6" fill="url(#coreGrad)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="400" y="152" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="bold" fill="#4f46e5" text-anchor="middle">
    memory_0 : dual_port_sram_8x32_core
  </text>

  <!-- Internal Memory Array Block -->
  <rect x="330" y="180" width="140" height="90" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="400" y="215" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">
    ram[2:0]
  </text>
  <text x="400" y="235" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">
    32-bit x 8 Depth
  </text>
  <text x="400" y="252" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#15803d" text-anchor="middle">
    $readmemh("init.hex")
  </text>

  <!-- Internal Read Pipeline Register -->
  <rect x="345" y="325" width="110" height="45" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="400" y="352" font-family="monospace, &#39;Courier New&#39;" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">
    internal [31:0]
  </text>

  <!-- Clock Input -->
  <path d="M 60 140 L 250 140" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-clk)" />
  <text x="70" y="133" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#c2410c">clk</text>
  <!-- Internal Clock Distribution -->
  <path d="M 230 140 L 230 225 L 330 225" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-clk)" />
  <path d="M 230 225 L 230 347 L 345 347" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-clk)" />
  <circle cx="230" cy="140" r="3" fill="#ea580c" />
  <circle cx="230" cy="225" r="3" fill="#ea580c" />

  <!-- Clock Symbols on Sequential Blocks -->
  <path d="M 330 220 L 338 225 L 330 230" fill="none" stroke="#ea580c" stroke-width="1.5" />
  <path d="M 345 342 L 353 347 L 345 352" fill="none" stroke="#ea580c" stroke-width="1.5" />

  <!-- Port Controls & Data Inputs -->
  <!-- wen -->
  <path d="M 60 185 L 330 185" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="70" y="178" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#0369a1">wen</text>
  <text x="280" y="180" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#475569">.wen</text>

  <!-- waddr [2:0] -->
  <path d="M 60 210 L 330 210" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <!-- Bus slash -->
  <line x1="110" y1="205" x2="120" y2="215" stroke="#2563eb" stroke-width="2" />
  <text x="115" y="202" font-family="sans-serif" font-size="9" fill="#1d4ed8">3</text>
  <text x="70" y="203" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#1d4ed8">waddr[2:0]</text>
  <text x="270" y="205" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#475569">.waddr</text>

  <!-- din [31:0] -->
  <path d="M 60 245 L 330 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <line x1="110" y1="240" x2="120" y2="250" stroke="#2563eb" stroke-width="2" />
  <text x="115" y="237" font-family="sans-serif" font-size="9" fill="#1d4ed8">32</text>
  <text x="70" y="238" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#1d4ed8">din[31:0]</text>
  <text x="260" y="240" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#475569">.data_in</text>

  <!-- ren -->
  <path d="M 60 335 L 345 335" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="70" y="328" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#0369a1">ren</text>
  <text x="280" y="330" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#475569">.ren</text>

  <!-- raddr [2:0] -->
  <path d="M 60 360 L 290 360 L 290 260 L 330 260" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <line x1="110" y1="355" x2="120" y2="365" stroke="#2563eb" stroke-width="2" />
  <text x="115" y="352" font-family="sans-serif" font-size="9" fill="#1d4ed8">3</text>
  <text x="70" y="353" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#1d4ed8">raddr[2:0]</text>
  <text x="270" y="272" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#475569">.raddr</text>

  <!-- Internal RAM to Registered Output connection -->
  <path d="M 400 270 L 400 325" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <text x="408" y="300" font-family="sans-serif" font-size="10" fill="#475569">ram[raddr]</text>

  <!-- Registered Output to Port dout [31:0] -->
  <path d="M 455 347 L 740 347" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-bus)" />
  <line x1="670" y1="342" x2="680" y2="352" stroke="#2563eb" stroke-width="2" />
  <text x="675" y="339" font-family="sans-serif" font-size="9" fill="#1d4ed8">32</text>
  <text x="730" y="338" font-family="monospace, &#39;Courier New&#39;" font-size="12" fill="#1d4ed8" text-anchor="end">dout[31:0]</text>
  <text x="465" y="340" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#475569">.data_out</text>

  <!-- Assign Statement Representation -->
  <text x="520" y="365" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#15803d">assign data_out = internal;</text>

  <!-- Legend / Key -->
  <g transform="translate(180, 460)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#0284c7" stroke-width="2" />
    <text x="28" y="4" font-family="sans-serif" font-size="11" fill="#334155">Control Signal</text>

    <line x1="130" y1="0" x2="150" y2="0" stroke="#2563eb" stroke-width="2.5" />
    <text x="158" y="4" font-family="sans-serif" font-size="11" fill="#334155">Data/Address Bus</text>

    <line x1="280" y1="0" x2="300" y2="0" stroke="#ea580c" stroke-width="2" />
    <text x="308" y="4" font-family="sans-serif" font-size="11" fill="#334155">Clock</text>
  </g>
</svg>