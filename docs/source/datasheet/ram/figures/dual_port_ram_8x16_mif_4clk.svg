<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #212529; stroke-width: 2; }
      .subbox { fill: #ffffff; stroke: #495057; stroke-dasharray: 4; stroke-width: 1.5; }
      .text-title { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #212529; }
      .text-sub { font-family: sans-serif; font-weight: bold; font-size: 11px; fill: #343a40; }
      .text-port { font-family: monospace; font-size: 11px; fill: #212529; }
      .line { stroke: #212529; stroke-width: 1.5; fill: none; }
      .bus { stroke: #212529; stroke-width: 3; fill: none; }
      .arrow { fill: #212529; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <rect x="220" y="20" width="410" height="240" rx="8" class="box"/>
  <text x="425" y="45" text-anchor="middle" class="text-title">dual_port_ram_8x16_mif_4clk</text>
  <rect x="260" y="60" width="330" height="32" rx="4" class="subbox"/>
  <text x="425" y="80" text-anchor="middle" class="text-sub">DPRAM 256x16 [0] (clk_a[0] / clk_b[0])</text>
  
  <!-- Port A Inputs -->
  <path d="M 80 66 L 260 66" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="70" text-anchor="end" class="text-port">clk_a[0], we_a[0]</text>
  <path d="M 80 76 L 260 76" class="bus" marker-end="url(#arrow)"/>
  <text x="75" y="80" text-anchor="end" class="text-port">addr_a[0] [7:0], din_a[0] [15:0]</text>
  
  <!-- Port B Read -->
  <path d="M 80 86 L 260 86" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="90" text-anchor="end" class="text-port">clk_b[0], addr_b[0] [7:0]</text>
  <path d="M 590 76 L 770 76" class="bus" marker-end="url(#arrow)"/>
  <text x="775" y="80" text-anchor="start" class="text-port">dout_b[0] [15:0]</text>
  <rect x="260" y="100" width="330" height="32" rx="4" class="subbox"/>
  <text x="425" y="120" text-anchor="middle" class="text-sub">DPRAM 256x16 [1] (clk_a[1] / clk_b[1])</text>
  
  <!-- Port A Inputs -->
