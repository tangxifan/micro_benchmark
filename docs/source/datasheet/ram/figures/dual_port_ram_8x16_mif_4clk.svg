  <text x="775" y="120" text-anchor="start" class="text-port">dout_b[1] [15:0]</text>
  <rect x="260" y="140" width="330" height="32" rx="4" class="subbox"/>
  <text x="425" y="160" text-anchor="middle" class="text-sub">DPRAM 256x16 [2] (clk_a[2] / clk_b[2])</text>
  
