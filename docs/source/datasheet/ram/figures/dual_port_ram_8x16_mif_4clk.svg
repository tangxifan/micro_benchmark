  <path d="M 80 116 L 260 116" class="bus" marker-end="url(#arrow)"/>
  <text x="75" y="120" text-anchor="end" class="text-port">addr_a[1] [7:0], din_a[1] [15:0]</text>
  
  <!-- Port B Read -->
  <path d="M 80 126 L 260 126" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="130" text-anchor="end" class="text-port">clk_b[1], addr_b[1] [7:0]</text>
