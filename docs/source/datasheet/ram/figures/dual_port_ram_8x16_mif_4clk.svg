  <path d="M 80 186 L 260 186" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="190" text-anchor="end" class="text-port">clk_a[3], we_a[3]</text>
  <path d="M 80 196 L 260 196" class="bus" marker-end="url(#arrow)"/>
  <text x="75" y="200" text-anchor="end" class="text-port">addr_a[3] [7:0], din_a[3] [15:0]</text>
  
  <!-- Port B Read -->
  <path d="M 80 206 L 260 206" class="line" marker-end="url(#arrow)"/>
  <text x="75" y="210" text-anchor="end" class="text-port">clk_b[3], addr_b[3] [7:0]</text>
  <path d="M 590 196 L 770 196" class="bus" marker-end="url(#arrow)"/>
  <text x="775" y="200" text-anchor="start" class="text-port">dout_b[3] [15:0]</text>
</svg>