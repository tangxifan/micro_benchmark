  <text x="775" y="160" text-anchor="start" class="text-port">dout_b[2] [15:0]</text>
  <rect x="260" y="180" width="330" height="32" rx="4" class="subbox"/>
  <text x="425" y="200" text-anchor="middle" class="text-sub">DPRAM 256x16 [3] (clk_a[3] / clk_b[3])</text>
  
