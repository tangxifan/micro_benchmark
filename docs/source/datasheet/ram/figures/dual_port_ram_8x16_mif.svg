<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="sramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>

    <linearGradient id="arrayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>

    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="400" y="38" font-family="monospace, &#39;Courier New&#39;" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    dual_port_ram_8x16_mif Architecture
  </text>
  <text x="400" y="58" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Dual-Port 8x16 Synchronous RAM with MIF File Initialization
  </text>

  <!-- Outer Top-Level Wrapper (dual_port_ram_8x16_mif) -->
  <rect x="80" y="80" width="640" height="340" rx="10" fill="url(#moduleGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="100" y="108" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="bold" fill="#1d4ed8">
    dual_port_ram_8x16_mif (Top Wrapper)
  </text>

  <!-- Inner Submodule (dual_port_sram_128) -->
  <rect x="230" y="115" width="370" height="280" rx="8" fill="url(#sramGrad)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="245" y="138" font-family="monospace, &#39;Courier New&#39;" font-size="12" font-weight="bold" fill="#1e40af">
    memory_0 : dual_port_sram_128
  </text>

  <!-- Memory Array Core (ram[7:0]) -->
  <rect x="340" y="160" width="150" height="150" rx="6" fill="url(#arrayGrad)" stroke="#16a34a" stroke-width="1.5" />
  <text x="415" y="185" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">
    ram[7:0]
  </text>
  <text x="415" y="202" font-family="sans-serif" font-size="10" fill="#166534" text-anchor="middle">
    8 x 16-bit Array
  </text>
  
  <!-- MIF File Initialization Annotation -->
  <rect x="360" y="215" width="110" height="30" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="415" y="234" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#15803d" text-anchor="middle">
    $readmemh
  </text>
  <text x="415" y="285" font-family="monospace, &#39;Courier New&#39;" font-size="10" fill="#166534" text-anchor="middle">
    (MEM_FILE)
  </text>

  <!-- Output Register (internal) -->
  <rect x="510" y="225" width="70" height="80" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="545" y="255" font-family="monospace, &#39;Courier New&#39;" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">
    internal
  </text>
  <text x="545" y="272" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">
    [15:0] Reg
  </text>
  <path d="M 510 290 L 520 290 L 515 283 Z" fill="none" stroke="#ea580c" stroke-width="1" />

  <!-- Left External Inputs & Connections -->

  <!-- clk -->
  <path d="M 30 145 L 230 145" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="40" y="137" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#c2410c">clk</text>
  
  <!-- Internal Clock Distribution -->
  <path d="M 180 145 L 180 370 L 525 370 L 525 305" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-orange)" />
  <text x="210" y="140" font-family="monospace, &#39;Courier New&#39;" font-size="9" fill="#c2410c">wclk / rclk</text>

  <!-- wen -->
  <path d="M 30 185 L 340 185" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="40" y="177" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">wen</text>

  <!-- waddr[2:0] -->
  <path d="M 30 225 L 340 225" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="40" y="217" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">waddr[2:0]</text>

  <!-- din[15:0] -->
  <path d="M 30 265 L 340 265" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="40" y="257" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8">din[15:0]</text>

  <!-- ren -->
  <path d="M 30 315 L 340 315" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="40" y="307" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#15803d">ren</text>

  <!-- raddr[2:0] -->
  <path d="M 30 355 L 340 355" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="40" y="347" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#15803d">raddr[2:0]</text>

  <!-- Inter-stage Connections -->
  <!-- RAM Array -> internal Reg -->
  <path d="M 490 265 L 510 265" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- internal Reg -> dout[15:0] Output -->
  <path d="M 580 265 L 770 265" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="760" y="257" font-family="monospace, &#39;Courier New&#39;" font-size="11" fill="#1d4ed8" text-anchor="end">dout[15:0]</text>

  <!-- Legend -->
  <g transform="translate(180, 440)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="1.5" />
    <text x="28" y="4" font-family="sans-serif" font-size="10" fill="#334
