<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-bus { fill: none; stroke: #0284c7; stroke-width: 3; }
      .arrow { fill: #64748b; }
      .arrow-bus { fill: #0284c7; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .bus-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0284c7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-bus" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Top-Level Module Boundary -->
  <rect x="40" y="30" width="820" height="530" rx="12" ry="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" />
  <text x="60" y="55" class="title">SAPone Top-Level Architecture</text>

  <!-- Central System Bus -->
  <rect x="120" y="270" width="660" height="30" rx="4" ry="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="450" y="290" class="bus-label" text-anchor="middle">Central System Bus [7:0]</text>

  <!-- PC Module -->
  <rect x="70" y="90" width="110" height="70" class="module-box" />
  <rect x="70" y="90" width="110" height="25" class="header-bg" />
  <text x="125" y="107" class="label">PC</text>
  <text x="80" y="135" class="port-text">clk, clr_</text>
  <text x="80" y="150" class="port-text">cp (count)</text>

  <!-- MAR Module -->
  <rect x="220" y="90" width="110" height="70" class="module-box" />
  <rect x="220" y="90" width="110" height="25" class="header-bg" />
  <text x="275" y="107" class="label">MAR</text>
  <text x="230" y="135" class="port-text">lm_, clk</text>
  <text x="230" y="150" class="port-text">in: bus[3:0]</text>

  <!-- ROM Module -->
  <rect x="370" y="90" width="110" height="70" class="module-box" />
  <rect x="370" y="90" width="110" height="25" class="header-bg" />
  <text x="425" y="107" class="label">ROM</text>
  <text x="380" y="135" class="port-text">addr: mar_out</text>
  <text x="380" y="150" class="port-text">rom_out [7:0]</text>

  <!-- IR Module -->
  <rect x="520" y="90" width="110" height="70" class="module-box" />
  <rect x="520" y="90" width="110" height="25" class="header-bg" />
  <text x="575" y="107" class="label">IR</text>
  <text x="530" y="135" class="port-text">li_, clk, clr_</text>
  <text x="530" y="150" class="port-text">opcode / oprand</text>

  <!-- Controller Module -->
  <rect x="670" y="90" width="150" height="70" class="module-box" />
  <rect x="670" y="90" width="150" height="25" class="header-bg" />
  <text x="745" y="107" class="label">Controller (FSM)</text>
  <text x="680" y="135" class="port-text">opcode -> con [11:0]</text>
  <text x="680" y="150" class="port-text">clk, clr_</text>

  <!-- ACC Module -->
  <rect x="70" y="380" width="110" height="70" class="module-box" />
  <rect x="70" y="380" width="110" height="25" class="header-bg" />
  <text x="125" y="397" class="label">ACC</text>
  <text x="80" y="425" class="port-text">la_, clk, clr_</text>
  <text x="80" y="440" class="port-text">acc_out1 / out2</text>

  <!-- BRegister Module -->
  <rect x="230" y="380" width="110" height="70" class="module-box" />
  <rect x="230" y="380" width="110" height="25" class="header-bg" />
  <text x="285" y="397" class="label">BRegister</text>
  <text x="240" y="425" class="port-text">lb_, clk, clr_</text>
  <text x="240" y="440" class="port-text">B_out [7:0]</text>

  <!-- ADDSUB Module -->
  <rect x="390" y="380" width="130" height="70" class="module-box" />
  <rect x="390" y="380" width="130" height="25" class="header-bg" />
  <text x="455" y="397" class="label">ADDSUB (ALU)</text>
  <text x="400" y="425" class="port-text">su (add/sub)</text>
  <text x="400" y="440" class="port-text">out: ADDSUB_out</text>

  <!-- OutputRegister Module -->
  <rect x="580" y="380" width="130" height="70" class="module-box" />
  <rect x="580" y="380" width="130" height="25" class="header-bg" />
  <text x="645" y="397" class="label">OutputRegister</text>
  <text x="590" y="425" class="port-text">lo_, clk, clr_</text>
  <text x="590" y="440" class="port-text">SAP_out [7:0]</text>

  <!-- Interconnect Wires -->
  <!-- PC to Bus -->
  <line x1="125" y1="160" x2="125" y2="270" class="wire-bus" marker-end="url(#arrow-bus)" />
  <!-- MAR to ROM -->
  <line x1="330" y1="125" x2="370" y2="125" class="wire-bus" marker-end="url(#arrow-bus)" />
  <!-- ROM to Bus -->
  <line x1="425" y1="160" x2="425" y2="270" class="wire-bus" marker-end="url(#arrow-bus)" />
  <!-- IR to Controller & Bus -->
  <line x1="575" y1="160" x2="575" y2="270" class="wire-bus" marker-end="url(#arrow-bus)" />
  <line x1="625" y1="125" x2="670" y2="125" class="wire" marker-end="url(#arrow)" />

  <!-- ACC to Bus -->
  <line x1="125" y1="380" x2="125" y2="300" class="wire-bus" marker-end="url(#arrow-bus)" />
  <!-- ALU connections -->
  <line x1="180" y1="415" x2="390" y2="415" class="wire" marker-end="url(#arrow)" />
  <line x1="340" y1="415" x2="390" y2="435" class="wire" marker-end="url(#arrow)" />
  <line x1="455" y1="380" x2="455" y2="300" class="wire-bus" marker-end="url(#arrow-bus)" />

  <!-- Output Register to SAP_out -->
  <line x1="645" y1="450" x2="645" y2="510" class="wire" />
  <line x1="645" y1="510" x2="810" y2="510" class="wire-bus" marker-end="url(#arrow-bus)" />
  <text x="730" y="500" class="port-text">SAP_out [7:0]</text>

</svg>