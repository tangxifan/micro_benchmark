<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1e293b; }
      .port-type { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .arrow { fill: #64748b; }
      .internal-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 4px; ry: 4px; }
      .internal-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Module Box -->
  <rect x="220" y="30" width="310" height="320" class="module-box"/>
  <rect x="220" y="30" width="310" height="40" class="header-bg"/>
  <text x="375" y="55" class="title" text-anchor="middle">routing_test</text>

  <!-- Internal Representation -->
  <rect x="260" y="100" width="230" height="220" class="internal-box"/>
  <text x="375" y="140" class="internal-text">Synchronous Pipeline Registers</text>
  <text x="375" y="165" class="internal-text">OUT0 &lt;= IN0</text>
  <text x="375" y="190" class="internal-text">OUT1 &lt;= IN1</text>
  <text x="375" y="215" class="internal-text">OUT2 &lt;= IN2</text>

  <!-- Input Ports (Left Side) -->
  <!-- IN0 -->
  <line x1="130" y1="100" x2="220" y2="100" class="wire" marker-end="url(#arrow)"/>
  <text x="140" y="93" class="port-text">IN0</text>
  <text x="140" y="113" class="port-type">input</text>

  <!-- IN1 -->
  <line x1="130" y1="160" x2="220" y2="160" class="wire" marker-end="url(#arrow)"/>
  <text x="140" y="153" class="port-text">IN1</text>
  <text x="140" y="173" class="port-type">input</text>

  <!-- IN2 -->
  <line x1="130" y1="220" x2="220" y2="220" class="wire" marker-end="url(#arrow)"/>
  <text x="140" y="213" class="port-text">IN2</text>
  <text x="140" y="233" class="port-type">input</text>

  <!-- clk -->
  <line x1="130" y1="280" x2="220" y2="280" class="wire" marker-end="url(#arrow)"/>
  <text x="140" y="273" class="port-text">clk</text>
  <text x="140" y="293" class="port-type">input</text>

  <!-- Output Ports (Right Side) -->
  <!-- OUT0 -->
  <line x1="530" y1="130" x2="620" y2="130" class="wire" marker-end="url(#arrow)"/>
  <text x="555" y="123" class="port-text">OUT0</text>
  <text x="555" y="143" class="port-type">output reg</text>

  <!-- OUT1 -->
  <line x1="530" y1="190" x2="620" y2="190" class="wire" marker-end="url(#arrow)"/>
  <text x="555" y="183" class="port-text">OUT1</text>
  <text x="555" y="203" class="port-type">output reg</text>

  <!-- OUT2 -->
  <line x1="530" y1="250" x2="620" y2="250" class="wire" marker-end="url(#arrow)"/>
  <text x="555" y="243" class="port-text">OUT2</text>
  <text x="555" y="263" class="port-type">output reg</text>

</svg>
