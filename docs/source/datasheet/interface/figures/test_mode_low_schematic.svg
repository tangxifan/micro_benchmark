<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-bus { fill: none; stroke: #0284c7; stroke-width: 2.5; }
      .arrow { fill: #64748b; }
      .arrow-bus { fill: #0284c7; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-bus" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="50" y="30" width="750" height="390" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="70" y="55" class="title">test_mode_low Architecture</text>

  <!-- Input Wires / Ports -->
  <!-- a -->
  <line x1="30" y1="120" x2="180" y2="120" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="112" class="port-text">a</text>

  <!-- b -->
  <line x1="30" y1="260" x2="180" y2="260" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="252" class="port-text">b</text>

  <!-- clk / reset -->
  <line x1="30" y1="350" x2="180" y2="350" class="wire" marker-end="url(#arrow)" />
  <text x="40" y="342" class="port-text">clk, reset</text>

  <!-- Pipe A Register Block -->
  <rect x="180" y="90" width="140" height="70" class="module-box" />
  <rect x="180" y="90" width="140" height="25" class="header-bg" />
  <text x="250" y="107" class="label">pipe_a [1:0]</text>
  <text x="190" y="135" class="port-text">Shift Register</text>

  <!-- Pipe B Register Block -->
  <rect x="180" y="230" width="140" height="70" class="module-box" />
  <rect x="180" y="230" width="140" height="25" class="header-bg" />
  <text x="250" y="247" class="label">pipe_b [1:0]</text>
  <text x="190" y="275" class="port-text">Shift Register</text>

  <!-- Combinational Logic / Adder Network -->
  <rect x="390" y="140" width="180" height="140" class="module-box" />
  <rect x="390" y="140" width="180" height="25" class="header-bg" />
  <text x="480" y="157" class="label">Combinational Sum</text>
  <text x="400" y="190" class="port-text">sum[1:0] = a[1]+b[1]+...</text>
  <text x="400" y="215" class="port-text">sum[3:2], [5:4], [7:6]</text>

  <!-- Pipe Sum Register Block -->
  <rect x="620" y="140" width="140" height="70" class="module-box" />
  <rect x="620" y="140" width="140" height="25" class="header-bg" />
  <text x="690" y="157" class="label">pipe_sum [3:0]</text>
  <text x="630" y="185" class="port-text">Registered Sum</text>

  <!-- Internal Interconnects -->
  <line x1="320" y1="125" x2="390" y2="180" class="wire" marker-end="url(#arrow)" />
  <line x1="320" y1="265" x2="390" y2="220" class="wire" marker-end="url(#arrow)" />
  
  <line x1="570" y1="210" x2="620" y2="185" class="wire-bus" marker-end="url(#arrow-bus)" />
  
  <path d="M 690 210 L 690 330 L 480 330 L 480 280" class="wire" marker-end="url(#arrow)" />
  <text x="590" y="320" class="port-text">Feedback</text>

  <!-- Output Wire -->
  <line x1="760" y1="175" x2="810" y2="175" class="wire-bus" marker-end="url(#arrow-bus)" />
  <text x="770" y="165" class="port-text">out [3:0]</text>

</svg>