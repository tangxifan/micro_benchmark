<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg{fill:#fff}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .block{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.8}
      .reg{fill:#ecfeff;stroke:#0e7490;stroke-width:1.6}
      .logic{fill:#fff7ed;stroke:#c2410c;stroke-width:1.8}
      .wire{fill:none;stroke:#334155;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
      .outwire{fill:none;stroke:#047857;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
      .title{font:700 25px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:14px Arial,sans-serif;fill:#475569}
      .label{font:600 14px Arial,sans-serif;fill:#0f172a}
      .small{font:12px Arial,sans-serif;fill:#334155}
      .tiny{font:11px Arial,sans-serif;fill:#475569}
      .port{fill:#fff;stroke:#64748b;stroke-width:1.4}
      .section{font:700 17px Arial,sans-serif;fill:#1e293b}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect class="bg" width="1500" height="900"/>
  <text x="55" y="48" class="title">test_modes — RTL schematic</text>
  <text x="55" y="73" class="subtitle">Derived from K6N10_test_modes.v · positive-edge-triggered registers · not a technology-mapped netlist</text>

  <!-- Control path -->
  <rect x="40" y="100" width="1420" height="235" rx="12" class="panel"/>
  <text x="65" y="130" class="section">Control / mode path</text>
  <text x="70" y="168" class="label">Inputs</text>
  <rect x="70" y="180" width="58" height="34" rx="5" class="port"/><text x="99" y="202" text-anchor="middle" class="label">e</text>
  <rect x="70" y="229" width="58" height="34" rx="5" class="port"/><text x="99" y="251" text-anchor="middle" class="label">f</text>
  <rect x="70" y="278" width="58" height="34" rx="5" class="port"/><text x="99" y="300" text-anchor="middle" class="label">g</text>
  <path class="wire" d="M128 197 H190 V216 H235" marker-end="url(#arrow)"/>
  <path class="wire" d="M128 246 H170 V256 H235" marker-end="url(#arrow)"/>
  <path class="wire" d="M128 295 H190 V216"/>
  <rect x="235" y="185" width="195" height="95" rx="8" class="logic"/>
  <text x="332" y="210" text-anchor="middle" class="label">Combinational logic</text>
  <text x="332" y="237" text-anchor="middle" class="small">d0 = (e AND g) OR</text>
  <text x="332" y="256" text-anchor="middle" class="small">(NOT f)</text>
  <path class="wire" d="M430 232 H465" marker-end="url(#arrow)"/>
  <text x="448" y="220" class="tiny" text-anchor="middle">d0</text>
  <rect x="465" y="188" width="80" height="88" rx="7" class="reg"/>
  <text x="505" y="218" text-anchor="middle" class="label">reg0</text><text x="505" y="240" text-anchor="middle" class="tiny">D flip-flop</text><text x="505" y="260" text-anchor="middle" class="tiny">posedge clk</text>
  <path class="wire" d="M545 232 H570" marker-end="url(#arrow)"/>
  <g id="shift">
    <rect x="570" y="188" width="64" height="88" rx="7" class="reg"/><text x="602" y="220" text-anchor="middle" class="label">reg1</text><text x="602" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M634 232 H652" marker-end="url(#arrow)"/>
    <rect x="652" y="188" width="64" height="88" rx="7" class="reg"/><text x="684" y="220" text-anchor="middle" class="label">reg2</text><text x="684" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M716 232 H734" marker-end="url(#arrow)"/>
    <rect x="734" y="188" width="64" height="88" rx="7" class="reg"/><text x="766" y="220" text-anchor="middle" class="label">reg3</text><text x="766" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M798 232 H816" marker-end="url(#arrow)"/>
    <rect x="816" y="188" width="64" height="88" rx="7" class="reg"/><text x="848" y="220" text-anchor="middle" class="label">reg4</text><text x="848" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M880 232 H898" marker-end="url(#arrow)"/>
    <rect x="898" y="188" width="64" height="88" rx="7" class="reg"/><text x="930" y="220" text-anchor="middle" class="label">reg5</text><text x="930" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M962 232 H980" marker-end="url(#arrow)"/>
    <rect x="980" y="188" width="64" height="88" rx="7" class="reg"/><text x="1012" y="220" text-anchor="middle" class="label">reg6</text><text x="1012" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M1044 232 H1062" marker-end="url(#arrow)"/>
    <rect x="1062" y="188" width="64" height="88" rx="7" class="reg"/><text x="1094" y="220" text-anchor="middle" class="label">reg7</text><text x="1094" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M1126 232 H1144" marker-end="url(#arrow)"/>
    <rect x="1144" y="188" width="64" height="88" rx="7" class="reg"/><text x="1176" y="220" text-anchor="middle" class="label">reg8</text><text x="1176" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M1208 232 H1226" marker-end="url(#arrow)"/>
    <rect x="1226" y="188" width="64" height="88" rx="7" class="reg"/><text x="1258" y="220" text-anchor="middle" class="label">reg9</text><text x="1258" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M1290 232 H1308" marker-end="url(#arrow)"/>
    <rect x="1308" y="188" width="64" height="88" rx="7" class="reg"/><text x="1340" y="220" text-anchor="middle" class="label">reg10</text><text x="1340" y="242" text-anchor="middle" class="tiny">DFF</text>
    <path class="wire" d="M1372 232 H1390" marker-end="url(#arrow)"/>
    <rect x="1390" y="188" width="52" height="88" rx="7" class="reg"/><text x="1416" y="220" text-anchor="middle" class="label">reg11</text><text x="1416" y="242" text-anchor="middle" class="tiny">DFF</text>
  </g>
  <text x="766" y="299" text-anchor="middle" class="small">x = reg3</text>
  <text x="1094" y="299" text-anchor="middle" class="small">y = reg7</text>
  <text x="1416" y="299" text-anchor="middle" class="small">z = reg11</text>
  <path class="outwire" d="M766 276 V310 H735" marker-end="url(#greenArrow)"/>
  <path class="outwire" d="M1094 276 V310 H1060" marker-end="url(#greenArrow)"/>
  <path class="outwire" d="M1416 276 V310 H1382" marker-end="url(#greenArrow)"/>

  <!-- Arithmetic path -->
  <rect x="40" y="360" width="1420" height="485" rx="12" class="panel"/>
  <text x="65" y="392" class="section">Registered 4-bit adder datapath</text>
  <text x="70" y="430" class="label">Input ports</text>
  <g class="small">
    <text x="75" y="463">a_0</text><text x="75" y="491">a_1</text><text x="75" y="519">a_2</text><text x="75" y="547">a_3</text>
    <text x="75" y="600">b_0</text><text x="75" y="628">b_1</text><text x="75" y="656">b_2</text><text x="75" y="684">b_3</text>
    <text x="75" y="736">cin</text>
  </g>
  <g class="port">
    <rect x="115" y="446" width="38" height="22" rx="3"/><rect x="115" y="474" width="38" height="22" rx="3"/><rect x="115" y="502" width="38" height="22" rx="3"/><rect x="115" y="530" width="38" height="22" rx="3"/>
    <rect x="115" y="583" width="38" height="22" rx="3"/><rect x="115" y="611" width="38" height="22" rx="3"/><rect x="115" y="639" width="38" height="22" rx="3"/><rect x="115" y="667" width="38" height="22" rx="3"/>
    <rect x="115" y="719" width="38" height="22" rx="3"/>
  </g>
  <text x="134" y="461" text-anchor="middle" class="tiny">in</text><text x="134" y="489" text-anchor="middle" class="tiny">in</text><text x="134" y="517" text-anchor="middle" class="tiny">in</text><text x="134" y="545" text-anchor="middle" class="tiny">in</text>
  <text x="134" y="598" text-anchor="middle" class="tiny">in</text><text x="134" y="626" text-anchor="middle" class="tiny">in</text><text x="134" y="654" text-anchor="middle" class="tiny">in</text><text x="134" y="682" text-anchor="middle" class="tiny">in</text><text x="134" y="734" text-anchor="middle" class="tiny">in</text>
  <text x="210" y="430" class="label">Input registers (posedge clk)</text>
  <g>
    <rect x="210" y="446" width="90" height="106" rx="7" class="reg"/><text x="255" y="474" text-anchor="middle" class="label">reg_a[3:0]</text><text x="255" y="497" text-anchor="middle" class="tiny">4 DFFs</text><text x="255" y="518" text-anchor="middle" class="tiny">a_0…a_3</text>
    <rect x="210" y="583" width="90" height="106" rx="7" class="reg"/><text x="255" y="611" text-anchor="middle" class="label">reg_b[3:0]</text><text x="255" y="634" text-anchor="middle" class="tiny">4 DFFs</text><text x="255" y="655" text-anchor="middle" class="tiny">b_0…b_3</text>
    <rect x="210" y="719" width="90" height="48" rx="7" class="reg"/><text x="255" y="748" text-anchor="middle" class="label">reg_cin</text>
  </g>
  <path class="wire" d="M153 457 H180 V499 H210" marker-end="url(#arrow)"/>
  <path class="wire" d="M153 485 H180 M153 513 H180 M153 541 H180"/>
  <path class="wire" d="M153 594 H180 V636 H210" marker-end="url(#arrow)"/>
  <path class="wire" d="M153 622 H180 M153 650 H180 M153 678 H180"/>
  <path class="wire" d="M153 730 H210" marker-end="url(#arrow)"/>

  <path class="wire" d="M300 499 H360 V535 H405" marker-end="url(#arrow)"/>
  <path class="wire" d="M300 636 H360 V570 H405" marker-end="url(#arrow)"/>
  <path class="wire" d="M300 743 H350 V605 H405" marker-end="url(#arrow)"/>
  <text x="352" y="520" class="tiny">a[3:0]</text><text x="352" y="590" class="tiny">b[3:0]</text><text x="352" y="625" class="tiny">cin</text>

  <rect x="405" y="482" width="205" height="158" rx="10" class="block"/>
  <text x="507" y="512" text-anchor="middle" class="label">4-bit adder</text>
  <text x="507" y="540" text-anchor="middle" class="small">n0 = a + b + reg_cin</text>
  <text x="507" y="565" text-anchor="middle" class="small">n0[3:0] = sum bits</text>
  <text x="507" y="590" text-anchor="middle" class="small">n0[4] = carry out</text>
  <text x="507" y="617" text-anchor="middle" class="tiny">combinational</text>

  <path class="wire" d="M610 561 H660" marker-end="url(#arrow)"/>
  <text x="635" y="548" text-anchor="middle" class="tiny">n0[4:0]</text>
  <rect x="660" y="438" width="140" height="236" rx="9" class="reg"/>
  <text x="730" y="465" text-anchor="middle" class="label">Output registers</text>
  <text x="730" y="487" text-anchor="middle" class="tiny">posedge clk</text>
  <line x1="675" y1="500" x2="785" y2="500" stroke="#0e7490" stroke-width="1"/>
  <text x="680" y="525" class="small">sum_0 &lt;= n0[0]</text>
  <text x="680" y="553" class="small">sum_1 &lt;= n0[1]</text>
  <text x="680" y="581" class="small">sum_2 &lt;= n0[2]</text>
  <text x="680" y="609" class="small">sum_3 &lt;= n0[3]</text>
  <text x="680" y="637" class="small">cout   &lt;= n0[4]</text>

  <path class="outwire" d="M800 525 H865" marker-end="url(#greenArrow)"/>
  <path class="outwire" d="M800 553 H865" marker-end="url(#greenArrow)"/>
  <path class="outwire" d="M800 581 H865" marker-end="url(#greenArrow)"/>
  <path class="outwire" d="M800 609 H865" marker-end="url(#greenArrow)"/>
  <path class="outwire" d="M800 637 H865" marker-end="url(#greenArrow)"/>
  <rect x="865" y="498" width="125" height="164" rx="8" class="port"/>
  <text x="927" y="523" text-anchor="middle" class="label">Outputs</text>
  <text x="883" y="548" class="small">sum_0</text><text x="883" y="576" class="small">sum_1</text><text x="883" y="604" class="small">sum_2</text><text x="883" y="632" class="small">sum_3</text><text x="883" y="650" class="small">cout</text>

  <rect x="1040" y="438" width="380" height="236" rx="10" class="panel"/>
  <text x="1065" y="470" class="label">Timing notes</text>
  <text x="1065" y="501" class="small">• All register updates occur on posedge clk.</text>
  <text x="1065" y="528" class="small">• a, b, and cin are registered before the adder.</text>
  <text x="1065" y="555" class="small">• Sum/carry are registered from the adder result.</text>
  <text x="1065" y="582" class="small">• Control path is a 12-stage shift register.</text>
  <text x="1065" y="609" class="small">• x, y, z tap reg3, reg7, and reg11.</text>
  <text x="1065" y="642" class="tiny">clk omitted from individual DFF symbols for clarity.</text>

  <text x="55" y="875" class="tiny">Legend: cyan = registers · orange = control logic · indigo = arithmetic logic · green wires = module outputs</text>
</svg>