<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .module-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; rx: 8px; ry: 8px; }
      .header-bg { fill: #eff6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e3a8a; }
      .port-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; }
      .wire-clk { fill: none; stroke: #ef4444; stroke-width: 2; }
      .wire-bus { fill: none; stroke: #0284c7; stroke-width: 2.5; }
      .arrow { fill: #64748b; }
      .arrow-clk { fill: #ef4444; }
      .arrow-bus { fill: #0284c7; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-clk" />
    </marker>
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" class="arrow-bus" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Module Boundary Box -->
  <rect x="40" y="30" width="870" height="490" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <text x="60" y="55" class="title">test_modes (K6N10 Benchmark) Architecture</text>

  <!-- Clock Input -->
  <line x1="20" y1="460" x2="880" y2="460" class="wire-clk" marker-end="url(#arrow-clk)" />
  <text x="30" y="450" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11px">clk (posedge trigger)</text>

  <!-- Control Term Block (d0) -->
  <rect x="70" y="90" width="220" height="100" class="module-box" />
  <rect x="70" y="90" width="220" height="25" class="header-bg" />
  <text x="180" y="107" class="label">Control Logic (d0)</text>
  <text x="80" y="135" class="port-text">Inputs: e, f, g[cite: 13]</text>
  <text x="80" y="155" class="port-text">d0 = (e && g) || !f[cite: 13]</text>

  <!-- 12-Stage Shift Register Chain -->
  <rect x="340" y="90" width="240" height="100" class="module-box" />
  <rect x="340" y="90" width="240" height="25" class="header-bg" />
  <text x="460" y="107" class="label">12-Stage Shift Register Chain</text>
  <text x="350" y="135" class="port-text">reg0 -> reg11[cite: 13]</text>
  <text x="350" y="155" class="port-text">Taps: x (reg3), y (reg7), z (reg11)[cite: 13]</text>

  <!-- Parallel 4-bit Adder Block (n0) -->
  <rect x="70" y="250" width="510" height="160" class="module-box" />
  <rect x="70" y="250" width="510" height="25" class="header-bg" />
  <text x="325" y="267" class="label">Parallel 4-Bit Adder (n0)</text>
  <text x="85" y="295" class="port-text">Inputs: a_3..a_0, b_3..b_0, cin (registered via reg_a, reg_b, reg_cin)[cite: 13]</text>
  <text x="85" y="325" class="port-text">n0 = a + b + reg_cin[cite: 13]</text>
  <text x="85" y="355" class="port-text">Outputs: sum_3..sum_0, cout[cite: 13]</text>

  <!-- Interconnects & Taps -->
  <line x1="290" y1="140" x2="340" y2="140" class="wire" marker-end="url(#arrow)" />
  
  <!-- Tap outputs x, y, z -->
  <line x1="580" y1="130" x2="840" y2="130" class="wire-bus" marker-end="url(#arrow-bus)" />
  <text x="730" y="120" class="port-text">x, y, z (Tapped Pipeline Outputs)[cite: 13]</text>

  <!-- Adder outputs -->
  <line x1="580" y1="330" x2="840" y2="330" class="wire-bus" marker-end="url(#arrow-bus)" />
  <text x="700" y="320" class="port-text">sum_3..0, cout (Registered Sum)[cite: 13]</text>

</svg>