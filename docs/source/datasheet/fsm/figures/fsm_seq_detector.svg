<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="100%">
  <defs>
    <!-- Grid pattern for background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>

    <!-- Shadow filter for main block -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="420" fill="#f8fafc" rx="8"/>
  <rect width="840" height="420" fill="url(#grid)" rx="8"/>

  <!-- Main Module Box -->
  <rect x="180" y="40" width="480" height="340" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#drop-shadow)"/>
  <rect x="180" y="40" width="480" height="36" rx="12" fill="#dbeafe"/>
  <rect x="180" y="64" width="480" height="12" fill="#dbeafe"/>

  <!-- Module Header Label -->
  <text x="420" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">fsm_seq_detector</text>

  <!-- INPUT: clk -->
  <path d="M 60 110 L 178 110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="102" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">clk</text>
  <text x="188" y="114" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">clk</text>

  <!-- INPUT: rst -->
  <path d="M 60 170 L 178 170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="162" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">rst</text>
  <text x="188" y="174" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">rst</text>

  <!-- INPUT: in -->
  <path d="M 60 270 L 178 270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="262" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">in</text>
  <text x="188" y="274" font-family="monospace" font-size="11" fill="#64748b" text-anchor="start">in</text>

  <!-- OUTPUT: out -->
  <path d="M 660 210 L 778 210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="652" y="214" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">out</text>
  <text x="773" y="202" font-family="monospace" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="end">out</text>

  <!-- 1. Next-State & Output Logic Block (Combinational) -->
  <g transform="translate(240, 220)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
    <text x="50" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">FSM LOGIC</text>
    <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">(Next-State</text>
    <text x="50" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">&amp; Decoder)</text>
  </g>

  <!-- Wire: 'in' -> FSM Logic -->
  <path d="M 180 270 L 240 270" stroke="#475569" stroke-width="2"/>

  <!-- Wire: FSM Logic Output -> 'out' Port -->
  <path d="M 340 250 L 500 250 L 500 210 L 660 210" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- 2. State Register Bank (Sequential) -->
  <rect x="420" y="100" width="80" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="460" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">STATE REG</text>
  <text x="428" y="136" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">D</text>
  <text x="428" y="170" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">RST</text>
  <text x="428" y="200" font-family="monospace" font-size="9" fill="#64748b" text-anchor="start">CLK</text>
  <text x="492" y="156" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">Q</text>
  <!-- Clock triangle symbol -->
  <path d="M 420 192 L 428 196 L 420 200" fill="none" stroke="#475569" stroke-width="1.2"/>

  <!-- Wire: FSM Next-State Output -> State Reg D Input -->
  <path d="M 340 235 L 380 235 L 380 136 L 418 136" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Wire: State Reg Q Output -> FSM Logic Feedback -->
  <path d="M 500 156 L 530 156 L 530 310 L 210 310 L 210 285 L 238 285" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Clock Distribution -->
  <path d="M 180 110 L 390 110 L 390 196 L 418 196" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Reset Distribution -->
  <path d="M 180 170 L 418 170" stroke="#475569" stroke-width="1.5"/>

  <!-- Port Pin Indicators -->
  <circle cx="180" cy="110" r="3" fill="#2563eb"/>
  <circle cx="180" cy="170" r="3" fill="#2563eb"/>
  <circle cx="180" cy="270" r="3" fill="#2563eb"/>
  <circle cx="660" cy="210" r="3" fill="#2563eb"/>
</svg>
